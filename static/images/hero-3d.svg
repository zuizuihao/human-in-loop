<svg class="ai-core" xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" fill="none" focusable="false" role="group" aria-label="Agent, RAG, LLM">
  <defs>
    <radialGradient id="ai-core-halo">
      <stop stop-color="#6dbfff" stop-opacity=".35"/>
      <stop offset=".6" stop-color="#9f88ff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#9f88ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ai-core-shell" cx=".28" cy=".2" r=".86">
      <stop class="ai-core-highlight" stop-opacity=".7"/>
      <stop offset=".36" stop-color="#7d9dff" stop-opacity=".22"/>
      <stop offset=".72" stop-color="#9872ee" stop-opacity=".16"/>
      <stop offset="1" stop-color="#8074dc" stop-opacity=".5"/>
    </radialGradient>
    <linearGradient id="ai-core-spectrum" x1="140" y1="110" x2="510" y2="510" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4de2c0"/>
      <stop offset=".45" stop-color="#649bf6"/>
      <stop offset="1" stop-color="#bd75ee"/>
    </linearGradient>
    <linearGradient id="ai-core-orbit" x1="70" y1="420" x2="560" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3ecab1" stop-opacity=".15"/>
      <stop offset=".45" stop-color="#5a9ee9"/>
      <stop offset="1" stop-color="#b58aef" stop-opacity=".45"/>
    </linearGradient>
    <radialGradient id="ai-core-center">
      <stop stop-color="#fff"/>
      <stop offset=".25" stop-color="#c9faff" stop-opacity=".95"/>
      <stop offset=".65" stop-color="#8f9bff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#8f9bff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ai-core-clip"><circle cx="320" cy="320" r="205"/></clipPath>
    <filter id="ai-core-shadow" x="-30%" y="-50%" width="160%" height="220%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#425787" flood-opacity=".12"/>
    </filter>
  </defs>

  <circle cx="320" cy="320" r="310" fill="url(#ai-core-halo)"/>
  <g class="ai-core-body">
    <circle class="ai-core-surface" cx="320" cy="320" r="205"/>
    <circle cx="320" cy="320" r="205" fill="url(#ai-core-shell)" stroke="url(#ai-core-spectrum)" stroke-opacity=".55"/>
    <g clip-path="url(#ai-core-clip)">
      <g class="ai-core-grid" stroke="url(#ai-core-spectrum)" stroke-width=".8" opacity=".55">
        <ellipse cx="320" cy="320" rx="38" ry="205"/>
        <ellipse cx="320" cy="320" rx="90" ry="205"/>
        <ellipse cx="320" cy="320" rx="142" ry="205"/>
        <ellipse cx="320" cy="320" rx="184" ry="205"/>
        <ellipse cx="320" cy="320" rx="205" ry="42"/>
        <ellipse cx="320" cy="320" rx="205" ry="96"/>
        <ellipse cx="320" cy="320" rx="205" ry="151"/>
        <ellipse cx="320" cy="320" rx="205" ry="189"/>
        <path d="M115 320h410M320 115v410"/>
      </g>
      <ellipse cx="280" cy="250" rx="130" ry="195" transform="rotate(35 280 250)" stroke="#fff" stroke-opacity=".32" stroke-width="2"/>
      <circle cx="320" cy="320" r="100" fill="url(#ai-core-center)" opacity=".8"/>
      <g class="ai-core-inner" stroke="url(#ai-core-spectrum)" stroke-width="1.5">
        <path d="m320 255 57 33v65l-57 33-57-33v-65l57-33Z" fill="#87b8ff" fill-opacity=".08"/>
        <path d="m263 288 57 33 57-33M320 321v65M320 255v66"/>
        <circle cx="320" cy="321" r="6" fill="#e1fcff" stroke="none"/>
      </g>
      <g fill="#b4f8ef">
        <circle cx="212" cy="257" r="3"/>
        <circle cx="406" cy="201" r="3"/>
        <circle cx="431" cy="380" r="3"/>
        <circle cx="263" cy="449" r="3"/>
      </g>
    </g>
    <path d="M162 210a205 205 0 0 1 257-69" stroke="#fff" stroke-opacity=".65" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g transform="rotate(-24 320 320)">
    <ellipse cx="320" cy="320" rx="275" ry="84" stroke="url(#ai-core-orbit)" stroke-width="1.5"/>
    <ellipse cx="320" cy="320" rx="288" ry="94" stroke="url(#ai-core-orbit)" stroke-opacity=".22"/>
    <g class="ai-core-particle">
      <animateMotion dur="18s" repeatCount="indefinite" path="M595 320a275 84 0 1 1-550 0 275 84 0 1 1 550 0"/>
      <circle r="12" fill="#71e5d1" fill-opacity=".14"/>
      <circle r="4" fill="#43cdb5"/>
    </g>
  </g>
  <g transform="rotate(57 320 320)">
    <ellipse cx="320" cy="320" rx="256" ry="103" stroke="url(#ai-core-spectrum)" stroke-opacity=".32"/>
    <g class="ai-core-particle">
      <animateMotion dur="25s" repeatCount="indefinite" path="M64 320a256 103 0 1 0 512 0 256 103 0 1 0-512 0"/>
      <circle r="4" fill="#a688f0"/>
    </g>
  </g>

  <a class="ai-core-link" href="/tags/agent/" aria-label="Agent">
  <g class="ai-core-card ai-core-card--agent">
    <g filter="url(#ai-core-shadow)">
      <rect class="ai-core-card-bg" x="68" y="146" width="153" height="66" rx="14"/>
      <rect class="ai-core-card-border" x="68.5" y="146.5" width="152" height="65" rx="13.5" stroke="url(#ai-core-spectrum)" stroke-opacity=".35"/>
    </g>
    <rect x="82" y="161" width="36" height="36" rx="10" fill="#49cfb1" fill-opacity=".13"/>
    <path d="m100 168 2 7 7 4-7 3-2 8-3-8-7-3 7-4 3-7Z" stroke="#27ad96" stroke-width="1.5" stroke-linejoin="round"/>
    <text class="ai-core-label" x="129" y="175">Agent</text>
    <text class="ai-core-muted" x="129" y="193">REASON + ACT</text>
  </g>
  </a>
  <a class="ai-core-link" href="/tags/rag/" aria-label="RAG">
  <g class="ai-core-card ai-core-card--rag">
    <g filter="url(#ai-core-shadow)">
      <rect class="ai-core-card-bg" x="425" y="235" width="145" height="66" rx="14"/>
      <rect class="ai-core-card-border" x="425.5" y="235.5" width="144" height="65" rx="13.5" stroke="url(#ai-core-spectrum)" stroke-opacity=".35"/>
    </g>
    <rect x="439" y="250" width="36" height="36" rx="10" fill="#739df1" fill-opacity=".14"/>
    <g stroke="#648cdb" stroke-width="1.5">
      <ellipse cx="457" cy="260" rx="8" ry="3"/>
      <path d="M449 260v15c0 4 16 4 16 0v-15M449 267c0 4 16 4 16 0"/>
    </g>
    <text class="ai-core-label" x="487" y="264">RAG</text>
    <text class="ai-core-muted" x="487" y="282">CONNECTED</text>
  </g>
  </a>
  <a class="ai-core-link" href="/tags/llm/" aria-label="LLM">
  <g class="ai-core-card ai-core-card--llm">
    <g filter="url(#ai-core-shadow)">
      <rect class="ai-core-card-bg" x="153" y="453" width="156" height="66" rx="14"/>
      <rect class="ai-core-card-border" x="153.5" y="453.5" width="155" height="65" rx="13.5" stroke="url(#ai-core-spectrum)" stroke-opacity=".35"/>
    </g>
    <rect x="167" y="468" width="36" height="36" rx="10" fill="#b185ed" fill-opacity=".14"/>
    <g stroke="#a279d5" stroke-width="1.5" stroke-linecap="round">
      <rect x="178" y="479" width="14" height="14" rx="3"/>
      <path d="M182 475v4m6-4v4m-6 14v4m6-4v4m-14-15h4m-4 6h4m14-6h4m-4 6h4"/>
      <path d="m182 486 3-3 3 3-3 3-3-3Z"/>
    </g>
    <text class="ai-core-label" x="215" y="482">LLM</text>
    <text class="ai-core-muted" x="215" y="500">LANGUAGE + LOGIC</text>
  </g>
  </a>

  <g class="ai-core-caption" aria-hidden="true">
    <circle cx="282" cy="568" r="3" fill="#2ab99e"/>
    <text class="ai-core-muted" x="295" y="572">IDEAS INTO REALITY</text>
  </g>

  <style>
    .ai-core-surface { fill: var(--ai-core-surface, #f1f5ff); }
    .ai-core-highlight { stop-color: var(--ai-core-highlight, #fff); }
    .ai-core-card-bg { fill: var(--ai-core-card, #fff); fill-opacity: .88; }
    .ai-core-label { fill: var(--ai-core-label, #293d5d); font: 600 15px system-ui, sans-serif; }
    .ai-core-muted { fill: var(--ai-core-muted, #6c7f9d); font: 500 8px system-ui, sans-serif; letter-spacing: .9px; }
    .ai-core-body { animation: ai-core-float 10s ease-in-out infinite; }
    .ai-core-grid {
      transform-origin: 320px 320px;
      animation: ai-core-turn 80s linear infinite;
    }
    .ai-core-card { animation: ai-core-float 7s ease-in-out infinite; }
    .ai-core-card--rag { animation-delay: -2s; }
    .ai-core-card--llm { animation-delay: -4s; }
    .ai-core-link { pointer-events: all; cursor: pointer; outline: none; }
    .ai-core-link:hover .ai-core-card, .ai-core-link:focus-visible .ai-core-card {
      animation-play-state: paused;
    }
    .ai-core-link:hover .ai-core-card-border, .ai-core-link:focus-visible .ai-core-card-border {
      stroke-opacity: 1;
      stroke-width: 2.5;
    }
    .ai-core-link:hover .ai-core-card-bg, .ai-core-link:focus-visible .ai-core-card-bg {
      fill-opacity: 1;
    }
    @keyframes ai-core-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    @keyframes ai-core-turn { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .ai-core-body, .ai-core-grid, .ai-core-card { animation: none; }
      .ai-core-particle { display: none; }
    }
  </style>
</svg>
