<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>客服 Copilot · Customer Service Copilot（原型）</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<!--
  Agent-assist prototype: an editable conversation context (product / plan /
  policy / claim / agent notes, each with its origin), customer-record lookup,
  and a clarify flow that asks the customer to narrow the product or plan when the
  context is unknown.

  Everything runs on mock data for a FICTIONAL insurer (no real company, products or terms):
  no API calls, no LLM. Retrieval is keyword matching over MOCK_KB, lookup is
  MOCK_CRM, and the "AI draft" is assembled from the selected sources.
  UI language: ?lang=en for English, default Simplified Chinese.
-->
<style>
  :root {
    --bg: #ffffff; --panel: #f6f7f8; --border: #dfe2e6; --text: #171717; --muted: #6b7280;
    --accent: #1769aa; --accent-soft: #eef4f8;
    --escalate: #c56b3c; --clarify: #a07a12; --answer: #287a55;
    --warn-bg: #fff6e8; --warn: #8f5300; --warn-border: #f1d5a5;
    --qa: #1769aa; --doc: #6a4fb3; --policy: #287a55; --claim: #b5482f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 14px;
         color: var(--text); background: var(--bg); height: 100vh; min-width: 1280px; display: flex; flex-direction: column; }
  [hidden] { display: none !important; }
  code, .mono { font-family: Consolas, "SFMono-Regular", monospace; font-size: 12px; }
  button, input, select, textarea { font-family: inherit; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; padding: 5px 9px; background: #fff; color: var(--text); }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: #b8c2cc; background: #fafbfc; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: #135d97; }
  button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  button.link { border: none; background: none; color: var(--accent); padding: 0 4px; font-size: 12px; text-decoration: underline; }
  button:disabled { opacity: .45; cursor: default; }
  select:focus, input:focus, textarea:focus { outline: 2px solid #b9d4e8; border-color: var(--accent); }

  header { display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header img { width: 32px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .proto { font-size: 11px; background: #fde8d8; color: #9a3d12; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
  header a { font-size: 12px; color: var(--muted); }
  header .spacer { flex: 1; }
  header .stats { font-size: 12px; color: var(--muted); display: flex; gap: 14px; }
  header .stats b { color: var(--text); }
  header .keys { font-size: 11px; color: var(--muted); }
  kbd { border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; font-size: 11px; background: #fff; }

  main { flex: 1; display: grid; grid-template-columns: 210px minmax(330px, 1fr) minmax(400px, 1.2fr) minmax(340px, 1fr); min-height: 0; }
  section { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); }
  section:last-child { border-right: none; }
  .col-title { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .03em; padding: 9px 14px;
               border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; min-height: 40px; }
  .scroll { flex: 1; overflow-y: auto; min-height: 0; }

  .badge { display: inline-block; padding: 1px 7px; border-radius: 10px; color: #fff; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
  .badge.answer { background: var(--answer); } .badge.escalate { background: var(--escalate); } .badge.clarify { background: var(--clarify); }
  .tag { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 11px; font-weight: 700; color: #fff; white-space: nowrap; }
  .tag.qa { background: var(--qa); } .tag.doc { background: var(--doc); } .tag.policy { background: var(--policy); } .tag.claim { background: var(--claim); }
  .chip { display: inline-flex; align-items: center; gap: 4px; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 1px 4px 1px 9px; font-size: 12px; max-width: 100%; }
  .chip .x { border: none; background: none; padding: 0 4px; color: var(--muted); font-size: 14px; line-height: 1; }
  .chip .x:hover { color: #b42318; }
  .origin { font-size: 10.5px; padding: 0 6px; border-radius: 8px; white-space: nowrap; }
  .origin.upstream { background: #eceff3; color: #4b5563; }
  .origin.ai { background: #f1ecfb; color: #5b3fa8; border: 1px dashed #a993dc; }
  .origin.agent { background: #e6f0f8; color: #1d5f93; }
  .origin.lookup { background: #e5f3ec; color: #22684a; }

  /* Queue */
  .queue-item { padding: 9px 12px; border-bottom: 1px solid var(--border); cursor: pointer; border-left: 3px solid transparent; }
  .queue-item:hover { background: #fafbfc; }
  .queue-item.active { background: var(--accent-soft); border-left-color: var(--accent); }
  .queue-item .name { font-weight: 600; display: flex; justify-content: space-between; gap: 6px; align-items: center; }
  .queue-item .preview { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
  .queue-item .meta { font-size: 11px; margin-top: 4px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .queue-item .prod { padding: 0 6px; border-radius: 8px; background: #eceff3; color: #4b5563; }
  .queue-item .prod.unknown { background: var(--warn-bg); color: var(--warn); }
  .queue-item .ready { color: var(--answer); }
  .queue-item .wait { color: var(--muted); margin-left: auto; }

  /* Context */
  .ctx-card { border-bottom: 1px solid var(--border); background: #fbfbfc; }
  .ctx-head { display: flex; align-items: center; gap: 6px; padding: 8px 12px; }
  .ctx-head strong { font-size: 13px; }
  .ctx-sum { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .ctx-grid { display: grid; grid-template-columns: 64px 1fr; gap: 6px 8px; padding: 0 12px 10px; align-items: center; font-size: 13px; }
  .ctx-grid > label { color: var(--muted); font-size: 12px; }
  .ctx-grid .val { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
  .ctx-grid select { padding: 3px 6px; max-width: 190px; }
  .ctx-grid select.unknown { border-color: #e2ad55; background: var(--warn-bg); color: var(--warn); }
  .ctx-grid .why { font-size: 11px; color: var(--muted); width: 100%; }
  .notes { display: flex; flex-direction: column; gap: 4px; align-items: stretch !important; }
  .notes .chip { border-radius: 6px; justify-content: space-between; }
  .notes input { width: 100%; font-size: 12px; }
  .ctx-warn { margin: 0 12px 10px; padding: 6px 10px; background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn); border-radius: 6px; font-size: 12px; }

  /* Conversation */
  #conversation { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 88%; padding: 8px 12px; border-radius: 10px; line-height: 1.5; white-space: pre-wrap; font-size: 14px; }
  .msg.customer { align-self: flex-start; background: #f1f2f4; border-top-left-radius: 2px; }
  .msg.agent { align-self: flex-end; background: var(--accent-soft); border: 1px solid #d4e3ee; border-top-right-radius: 2px; }
  .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .simulate { border-top: 1px solid var(--border); padding: 8px 10px; display: flex; gap: 6px; background: var(--panel); }
  .simulate input { flex: 1; }

  /* Draft */
  .draft-head .conf { font-size: 12px; font-weight: 600; }
  .conf.hi { color: var(--answer); } .conf.mid { color: var(--clarify); } .conf.lo { color: #b42318; }
  .draft-head select { margin-left: auto; padding: 3px 6px; font-weight: 400; color: var(--text); text-transform: none; letter-spacing: 0; }
  .intent-banner { margin: 10px 14px 0; padding: 8px 12px; border-radius: 6px; font-size: 13px; line-height: 1.5; }
  .intent-banner.escalate { background: #fbeee6; color: #8a3f17; border: 1px solid #f0cdb8; }
  .intent-banner.clarify { background: #fbf5e1; color: #6d560f; border: 1px solid #eadfae; }
  .intent-banner button { margin-left: 4px; }
  details.why { margin: 8px 14px 0; font-size: 12px; color: var(--muted); }
  details.why summary { cursor: pointer; user-select: none; }
  details.why ul { margin: 6px 0 0; padding-left: 18px; line-height: 1.6; }
  .draft-body { padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; }
  #draft { flex: 1; min-height: 200px; resize: none; line-height: 1.65; font-size: 14.5px; padding: 10px 12px; }
  #draft.generating { background: #fbfbfb; color: #555; }
  #draft:disabled { background: #f7f8f9; }
  .stale { background: var(--accent-soft); border: 1px dashed var(--accent); color: var(--accent); padding: 6px 10px; border-radius: 6px; font-size: 12.5px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .quick { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
  .quick button { font-size: 12px; padding: 2px 9px; border-radius: 12px; }
  .quick button.suggest { border-color: var(--clarify); background: #fbf5e1; color: #6d560f; font-weight: 600; }
  .cites { display: flex; flex-wrap: wrap; gap: 5px; font-size: 12px; }
  .cite-chip { border: 1px solid var(--border); border-radius: 12px; padding: 1px 9px; cursor: pointer; background: #fff; }
  .cite-chip:hover { border-color: var(--accent); }
  .cite-chip.missing { opacity: .45; text-decoration: line-through; }
  .warnings { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-border); border-radius: 6px; padding: 6px 10px; font-size: 12.5px; line-height: 1.6; }
  .toolbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .toolbar .sep { flex: 1; }
  .toolbar .group { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .toolbar .group button { border: none; border-radius: 0; border-right: 1px solid var(--border); }
  .toolbar .group button:last-child { border-right: none; }
  .toolbar .group button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .loading-dots span { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); margin-right: 3px; animation: blink 1.1s infinite; }
  .loading-dots span:nth-child(2) { animation-delay: .15s; } .loading-dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  /* Knowledge */
  .kb-tabs { display: flex; border-bottom: 1px solid var(--border); min-height: 40px; }
  .kb-tabs button { flex: 1; border: none; border-radius: 0; border-bottom: 2px solid transparent; background: transparent; padding: 9px 4px; font-weight: 600; color: var(--muted); }
  .kb-tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  .kb-search { padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .kb-search input { width: 100%; }
  .kb-list { padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
  .kb-card { border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; background: #fff; transition: box-shadow .2s, border-color .2s; }
  .kb-card.used { border-left: 4px solid var(--accent); }
  .kb-card.flash { box-shadow: 0 0 0 3px #b9d4e8; border-color: var(--accent); }
  .kb-card .top { display: flex; align-items: flex-start; gap: 6px; }
  .kb-card .cite-no { font-weight: 700; color: var(--accent); font-size: 13px; }
  .kb-card .title { font-weight: 600; flex: 1; line-height: 1.35; }
  .kb-card .src { font-size: 11.5px; color: var(--muted); margin: 3px 0 5px; display: flex; gap: 6px; flex-wrap: wrap; }
  .kb-card .appl { font-size: 11.5px; padding: 0 6px; border-radius: 4px; background: #eceff3; color: #4b5563; }
  .kb-card .appl.warn { background: var(--warn-bg); color: var(--warn); }
  .kb-card .snippet { font-size: 13px; line-height: 1.55; white-space: pre-wrap; color: #333; max-height: 6.3em; overflow: hidden; }
  .kb-card .snippet.open { max-height: none; }
  .kb-card mark { background: #fff1a8; padding: 0 1px; }
  .kb-card .actions { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; align-items: center; font-size: 12px; }
  .kb-card .actions button { padding: 2px 8px; font-size: 12px; }
  .kb-card .actions label { display: flex; align-items: center; gap: 4px; cursor: pointer; font-weight: 600; }
  .kb-card .actions .fb { margin-left: auto; display: flex; gap: 4px; }
  .kb-card .fb button.on { background: var(--accent-soft); border-color: var(--accent); }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 24px 8px; line-height: 1.6; }
  .kb-foot { border-top: 1px solid var(--border); padding: 8px 12px; background: var(--panel); }
  .kb-foot button { width: 100%; }

  /* Modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,.35); display: none; align-items: center; justify-content: center; z-index: 10; }
  .modal-bg.open { display: flex; }
  .modal { background: #fff; border-radius: 10px; padding: 16px 18px; width: 560px; max-height: 85vh; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
  .modal h3 { margin: 0; font-size: 15px; }
  .modal-body { overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  .modal textarea { min-height: 90px; resize: vertical; width: 100%; }
  .modal .row { display: flex; gap: 8px; justify-content: flex-end; }
  .modal .note { font-size: 12px; color: var(--muted); margin: 0; }
  .lk-cust { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .lk-name { background: var(--panel); padding: 6px 10px; font-weight: 600; font-size: 13px; display: flex; justify-content: space-between; }
  .lk-name span { font-weight: 400; color: var(--muted); }
  .lk-row { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-top: 1px solid var(--border); font-size: 12.5px; }
  .lk-row .desc { flex: 1; color: #374151; }
  pre.log { white-space: pre-wrap; font-size: 12px; background: #f7f7f7; padding: 8px; border-radius: 6px; margin: 0; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #222; color: #fff; padding: 8px 16px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
  .toast.show { opacity: .92; }
  header a.lang { font-weight: 600; color: var(--accent); }
  /* Tour mode (?tour=1): embedded in the blog post's slide deck. */
  body.tour #back-link, body.tour #lang-link { display: none; }
  .hl { outline: 3px solid #e11d48 !important; outline-offset: 3px; border-radius: 6px; }
</style>
</head>
<body>
<header>
  <h1 data-i18n="title"></h1>
  <span class="proto" data-i18n="proto"></span>
  <a id="back-link" data-i18n="back"></a>
  <a id="lang-link" class="lang"></a>
  <span class="spacer"></span>
  <span class="keys" data-i18n-html="keys"></span>
  <span class="stats" id="stats"></span>
  <button id="btn-log" data-i18n="btnLog"></button>
</header>

<main>
  <!-- 1. Queue -->
  <section>
    <div class="col-title" data-i18n="queue"></div>
    <div class="scroll" id="queue"></div>
  </section>

  <!-- 2. Context + conversation -->
  <section>
    <div class="ctx-card" id="ctx"></div>
    <div class="scroll" id="conv-scroll"><div id="conversation"></div></div>
    <div class="simulate">
      <input id="sim-input" />
      <button id="sim-send" data-i18n="simSend"></button>
    </div>
  </section>

  <!-- 3. Draft -->
  <section>
    <div class="col-title draft-head">
      <span data-i18n="draftTitle"></span> <span id="intent-badge"></span><span class="conf" id="conf"></span>
      <select id="lang-select">
        <option value="zh-cn">简体中文</option>
        <option value="en">English</option>
      </select>
    </div>
    <div id="intent-banner"></div>
    <details class="why" id="why"><summary data-i18n="why"></summary><ul id="why-list"></ul></details>
    <div class="draft-body">
      <div id="stale" class="stale" hidden><span id="stale-text"></span><button class="primary" id="btn-stale"></button></div>
      <textarea id="draft" spellcheck="false"></textarea>
      <div class="quick" id="quick">
        <span data-i18n="quick"></span>
        <button data-ask="product" data-i18n="qProduct"></button>
        <button data-ask="plan" data-i18n="qPlan"></button>
        <button data-ask="policy" data-i18n="qPolicy"></button>
        <button data-ask="date" data-i18n="qDate"></button>
        <button data-ask="docs" data-i18n="qDocs"></button>
      </div>
      <div class="cites" id="cites"></div>
      <div class="warnings" id="warnings" hidden></div>
      <div class="toolbar">
        <div class="group" id="tone-group">
          <button data-tone="concise" data-i18n="concise"></button>
          <button data-tone="formal" data-i18n="formal"></button>
          <button data-tone="friendly" data-i18n="friendly"></button>
        </div>
        <button id="btn-regen" title="Alt+R" data-i18n="regen"></button>
        <button id="btn-undo" class="ghost" data-i18n="undo"></button>
        <span class="sep"></span>
        <button class="primary" id="btn-send" title="Ctrl+Enter" data-i18n="send"></button>
      </div>
    </div>
  </section>

  <!-- 4. Knowledge -->
  <section>
    <div class="kb-tabs">
      <button data-tab="used" class="active"><span data-i18n="tabUsed"></span> <span id="cnt-used"></span></button>
      <button data-tab="related"><span data-i18n="tabRelated"></span> <span id="cnt-related"></span></button>
      <button data-tab="search" data-i18n="tabSearch"></button>
    </div>
    <div class="kb-search" id="kb-search" hidden><input id="kb-q" /></div>
    <div class="scroll"><div class="kb-list" id="kb-list"></div></div>
    <div class="kb-foot"><button id="btn-gap" data-i18n="gap"></button></div>
  </section>
</main>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <div class="modal-body" id="modal-body"></div>
    <div class="row" id="modal-actions"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ---------------------------------------------------------------------------
// UI language (?lang=en) and UI strings
// ---------------------------------------------------------------------------
const UI = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'zh';
const L = (v) => (v && typeof v === 'object' ? v[UI] : v);

const T = {
  zh: {
    title: '客服 Copilot', proto: '原型 · Mock 数据 · 示例保险公司（虚构）', back: '← 返回文章', backUrl: '/posts/agent-assist-design/', otherLang: 'English',
    keys: '<kbd>Ctrl</kbd>+<kbd>Enter</kbd> 发送 · <kbd>Alt</kbd>+<kbd>R</kbd> 重新生成', btnLog: '反馈记录', queue: '对话队列',
    simSend: '客户发送', simPh: (h) => `模拟客户新消息，${h}`, draftTitle: 'AI 建议回复', langTitle: '回复语言', why: 'AI 判断依据',
    quick: '快速提问：', qProduct: '产品类别', qPlan: '计划', qPolicy: '保单号', qDate: '出险日期', qDocs: '单据证明',
    concise: '简洁', formal: '正式', friendly: '亲切', regen: '重新生成', undo: '还原', undoTitle: '还原至 AI 原稿', send: '发送',
    tabUsed: '已引用', tabRelated: '其他相关', tabSearch: '搜索知识库', kbPh: '关键词，例如：行李、延误、退保、理赔进度', gap: '回报知识缺失（找不到合适答案）',
    origin: { upstream: '上游系统', ai: 'AI 推断', agent: '客服设置', lookup: '记录查询' },
    field: { product: '产品', plan: '计划', policyNo: '保单', claimNo: '理赔' },
    labels: { qa: '问答', doc: '产品条款', policy: '保单条款', claim: '理赔记录' },
    preparing: 'AI 准备中…', ready: '✓ 草稿已准备', replied: '已回复', prodUnknown: '产品未确定', mins: (n) => `${n} 分钟`, justNow: '刚刚',
    confirm: '确认', notesN: (n) => `备注 ${n}`, unknown: '未确定', pickProduct: '先选择产品类别', remove: '移除', lookShort: '搜索记录',
    sep: '、', whyFrom: (w) => `依据客户消息：${w}`,
    warnNoProduct: '⚠ 产品类别未确定：AI 会先请客户在相关产品中选择。可直接选择产品，或搜索客户记录加入保单。',
    warnNoPlan: 'ℹ 计划未确定：只会采用产品通用内容；涉及保额的内容需先确认计划。',
    ctxTitle: '客户 Context', lookupBtn: '＋ 搜索客户记录', collapse: '收起', expand: '展开',

const allCustomerText = (s) => [...s.messages.filter((m) => m.role === 'customer').map((m) => m.text), ...s.ctx.notes].join(' ').toLowerCase();
const retrievalText = (s) => [...s.messages.filter((m) => m.role === 'customer').slice(-2).map((m) => m.text), ...s.ctx.notes].join(' ').toLowerCase();

// Fill product / plan the conversation clearly implies, unless the agent has
// explicitly set the field (origin 'agent' — including "set back to unknown").
function inferContext(s) {
  const c = s.ctx, o = s.origin, text = allCustomerText(s);
  if (!c.product && o.product !== 'agent') {
    const scored = PRODUCT_KEYS.map((k) => ({ k, hits: PRODUCTS[k].kw.filter((w) => text.includes(w.toLowerCase())) }))
      .filter((x) => x.hits.length).sort((a, b) => b.hits.length - a.hits.length);
    if (scored.length && (scored.length === 1 || scored[0].hits.length > scored[1].hits.length)) {
      c.product = scored[0].k; o.product = 'ai'; s.why = { ...s.why, product: scored[0].hits };
    }
  }
  if (c.product && !c.plan && o.plan !== 'agent') {
    // Longest alias first so "Home Guard Plus" wins over "Home Guard".
    const plans = [...PRODUCTS[c.product].plans].sort((a, b) => b.name.en.length - a.name.en.length);
    const plan = plans.find((p) => [p.name.zh, p.name.en, ...p.alias].some((a) => text.includes(a.toLowerCase())));
    if (plan) { c.plan = plan.id; o.plan = 'ai'; s.why = { ...s.why, plan: [planName(plan.id)] }; }
  }
}

// Personal records need a matching policy / claim number. Product- or plan-specific
// knowledge is held back (needs = 'product' | 'plan') while that context is unknown.
function retrieve(s) {
  const text = retrievalText(s), c = s.ctx;
  return MOCK_KB.map((k) => {
    if (k.type === 'policy' && k.policyNo !== c.policyNo) return null;
    if (k.type === 'claim' && k.claimNo !== c.claimNo) return null;
    const personal = isPersonal(k);
    let needs = null;
    if (!personal && k.product) {
      if (c.product && k.product !== c.product) return null;
      if (!c.product) needs = 'product';
      else if (k.plan && c.plan && k.plan !== c.plan) return null;
      else if (k.plan && !c.plan) needs = 'plan';
    }
    const hits = k.kw.filter((w) => text.includes(w.toLowerCase()));
    if (!hits.length) return null;
    return { id: k.id, score: hits.length + (personal ? 1 : 0), needs };
  }).filter(Boolean).sort((a, b) => b.score - a.score);
}

function classify(s, ranked) {
  const c = s.ctx;
  if (ESCALATE_RE.test(lastCustomer(s))) return { intent: 'escalate' };
  if (!c.product && (!ranked.length || ranked.some((r) => r.needs === 'product'))) {
    const rel = [...new Set(ranked.filter((r) => r.needs === 'product').map((r) => kbById(r.id).product))];
    return { intent: 'clarify', reason: 'product', options: rel.length >= 2 ? rel : [...rel, ...PRODUCT_KEYS.filter((k) => !rel.includes(k))] };
  }
  if (c.product && !c.plan && ranked.some((r) => r.needs === 'plan')) {
    const rel = [...new Set(ranked.filter((r) => r.needs === 'plan').map((r) => kbById(r.id).plan))];
    const all = PRODUCTS[c.product].plans.map((p) => p.id);
    return { intent: 'clarify', reason: 'plan', options: [...rel, ...all.filter((p) => !rel.includes(p))] };
  }
  if (!ranked.some((r) => !r.needs)) return { intent: 'clarify', reason: 'info' };
  return { intent: 'answer' };
}

const ORDER = { claim: 0, doc: 1, qa: 2, policy: 3 }; // own record → plan terms → how-to → policy caveats

function prepare(sid, { keepSelection = false } = {}) {
  const s = sessionById(sid), prev = draftState[sid];
  inferContext(s);
  const ranked = retrieve(s);
  const cls = classify(s, ranked);
  const usable = ranked.filter((r) => !r.needs);
  const selected = keepSelection && prev ? prev.selected
    : usable.slice(0, 4).map((r) => r.id).sort((a, b) => ORDER[kbById(a).type] - ORDER[kbById(b).type]);
  let conf = cls.intent === 'clarify' ? (cls.reason === 'info' ? 0.4 : 0.62)
    : Math.min(0.96, 0.55 + 0.06 * usable.slice(0, 4).reduce((n, r) => n + r.score, 0));
  if (Object.values(s.origin).includes('ai')) conf -= 0.1;
  draftState[sid] = { lang: prev?.lang || s.lang, tone: prev?.tone || 'formal', feedback: prev?.feedback || {},
                      ranked, ...cls, product: s.ctx.product, conf, selected,
                      original: '', text: '', stale: null, generating: true };
  return draftState[sid];
}

function firstSentence(t) { return (t.match(/^.*?(。|！|？|[.!?](\s|$))/) || [t])[0].trim(); }

function clarifyText(d, P) {
  const list = (items) => items.map((x, i) => `${i + 1}. ${x}`).join('\n');
  if (d.reason === 'product') return `${P.askProduct}\n${list(d.options.map((k) => PRODUCTS[k].label[d.lang]))}\n${P.orPolicy}`;
  if (d.reason === 'plan') return `${P.askPlan(PRODUCTS[d.product].label[d.lang])}\n${list(d.options.map((id) => planName(id, d.lang)))}\n${P.orPolicy}`;
  return P.askInfo;
}

function compose(s, d) {
  const P = PHRASES[d.lang], out = [];
  const greet = P.greet[d.tone](s.name);
  if (greet) out.push(greet);
  if (d.intent === 'escalate') out.push(P.escalate);
  d.selected.forEach((id, i) => {
    const r = kbById(id).reply[d.lang];
    out.push(`${d.tone === 'concise' ? firstSentence(r) : r} [${i + 1}]`);
  });
  if (d.intent === 'clarify') out.push(clarifyText(d, P));
  if (P.close[d.tone]) out.push(P.close[d.tone]);
  return out.join(d.tone === 'concise' ? '\n' : '\n\n');
}

// Simulated latency + streaming: background sessions fill silently (the draft is
// ready before the agent opens them), the active one streams in.
function generate(sid, opts) {
  const d = prepare(sid, opts);
  const full = compose(sessionById(sid), d);
  d.original = full;
  if (sid !== state.active) { d.text = full; d.generating = false; renderQueue(); return; }
  if (TOUR) { d.text = full; d.generating = false; render(); return; } // deterministic for the slide deck
  render();
  let i = 0;
  const step = () => {
    if (draftState[sid] !== d) return; // superseded by a newer generation
    i = Math.min(full.length, i + 6);
    d.text = full.slice(0, i);
    if (state.active === sid) $('draft').value = d.text;
    if (i < full.length) setTimeout(step, 16);
    else { d.generating = false; if (state.active === sid) render(); else renderQueue(); }
  };
  setTimeout(step, 600);
}

// Re-compose from the agent's chosen sources / tone / language without re-retrieving.
function recompose() {
  const d = draftState[state.active];
  if (d.intent === 'answer' && !d.selected.length) { d.intent = 'clarify'; d.reason = 'info'; }
  else if (d.intent === 'clarify' && d.reason === 'info' && d.selected.length) { d.intent = 'answer'; d.reason = undefined; }
  d.original = d.text = compose(session(), d);
  d.stale = null;
  render();
}

// Context edits re-run retrieval. If the agent has not touched the draft we can
// regenerate straight away; otherwise keep their edits and offer a regenerate.
function onContextChanged(field, value) {
  const s = session(), d = draftState[s.id];
  logFeedback({ type: 'context_change', field, value, ctx: { ...s.ctx, notes: [...s.ctx.notes] } });
  if (!pending(s)) { render(); return; }
  if (!d.text || d.text === d.original) { generate(s.id); toast(T.ctxUpdated); }
  else { d.stale = 'context'; render(); }
}

function renderQueue() {
  $('queue').innerHTML = SESSIONS.map((s) => {
    const d = draftState[s.id], last = s.messages[s.messages.length - 1], wait = pending(s);
    const status = !d ? '' : d.generating ? `<span>${T.preparing}</span>` : wait ? `<span class="ready">${T.ready}</span>` : `<span>${T.replied}</span>`;
    const prod = s.ctx.product ? `<span class="prod">${pshort(s.ctx.product)}${s.origin.product === 'ai' ? '?' : ''}</span>` : `<span class="prod unknown">${T.prodUnknown}</span>`;
    return `<div class="queue-item ${s.id === state.active ? 'active' : ''}" data-sid="${s.id}">
      <div class="name"><span>${esc(s.name)}</span>${d && wait ? `<span class="badge ${d.intent}">${d.intent}</span>` : ''}</div>
      <div class="preview">${esc(s.channel)} · ${esc(last.text)}</div>
      <div class="meta">${prod}${status}${wait ? `<span class="wait">${s.wait ? T.mins(s.wait) : T.justNow}</span>` : ''}</div></div>`;
  }).join('');
}

function originTag(s, f) {
  const o = s.origin[f];
  if (!o || !s.ctx[f]) return '';
  return `<span class="origin ${o}">${T.origin[o]}</span>${o === 'ai' ? `<button class="link" data-confirm="${f}">${T.confirm}</button>` : ''}`;
}

function renderContext() {
  const s = session(), c = s.ctx;
  const summary = [c.product ? pshort(c.product) : T.prodUnknown, c.plan && planName(c.plan), c.policyNo, c.claimNo, c.notes.length ? T.notesN(c.notes.length) : '']
    .filter(Boolean).join(' · ');
  const productOpts = `<option value="">${T.unknown}</option>` + PRODUCT_KEYS.map((k) => `<option value="${k}" ${c.product === k ? 'selected' : ''}>${pshort(k)}</option>`).join('');
  const planOpts = c.product
    ? `<option value="">${T.unknown}</option>` + PRODUCTS[c.product].plans.map((p) => `<option value="${p.id}" ${c.plan === p.id ? 'selected' : ''}>${esc(planName(p.id))}</option>`).join('')
    : `<option value="">${T.pickProduct}</option>`;
  const ref = (f) => c[f]
    ? `<span class="chip mono">${esc(c[f])}<button class="x" data-clear="${f}" title="${T.remove}">×</button></span>${originTag(s, f)}`
    : `<span style="color:var(--muted)">—</span><button class="link" data-lookup>${T.lookShort}</button>`;
  const why = (f) => s.why?.[f] && s.origin[f] === 'ai' ? `<span class="why">${esc(T.whyFrom(s.why[f].join(T.sep)))}</span>` : '';
  const warn = !c.product ? T.warnNoProduct : !c.plan ? T.warnNoPlan : '';
  $('ctx').innerHTML = `
    <div class="ctx-head">
      <strong>${T.ctxTitle}</strong><span class="ctx-sum">${state.ctxOpen ? '' : esc(summary)}</span>
      <button data-lookup>${T.lookupBtn}</button>
      <button class="ghost" data-toggle>${state.ctxOpen ? T.collapse : T.expand}</button>
    </div>
    ${state.ctxOpen ? `<div class="ctx-grid">
      <label>${T.fProduct}</label><div class="val"><select data-field="product" class="${c.product ? '' : 'unknown'}">${productOpts}</select>${originTag(s, 'product')}${why('product')}</div>
      <label>${T.fPlan}</label><div class="val"><select data-field="plan" class="${c.product && !c.plan ? 'unknown' : ''}" ${c.product ? '' : 'disabled'}>${planOpts}</select>${originTag(s, 'plan')}${why('plan')}</div>
      <label>${T.fPolicy}</label><div class="val">${ref('policyNo')}</div>
      <label>${T.fClaim}</label><div class="val">${ref('claimNo')}</div>
      <label>${T.fNotes}</label><div class="val notes">
        ${c.notes.map((n, i) => `<span class="chip">${esc(n)}<button class="x" data-note="${i}" title="${T.remove}">×</button></span>`).join('')}
        <input id="note-input" placeholder="${T.notePh}" /></div>

}

function renderConversation() {
  const s = session();
  $('conversation').innerHTML = s.messages.map((m) =>
    `<div class="msg ${m.role}"><div class="who">${m.role === 'customer' ? `${esc(s.name)} · ${esc(s.channel)}` : T.agent}</div>${esc(m.text)}</div>`).join('');
  $('sim-input').placeholder = T.simPh(s.simHint);
  $('conv-scroll').scrollTop = 1e9;
}

function renderDraft() {
  const s = session(), d = draftState[s.id], wait = pending(s), ta = $('draft');
  const live = wait && !d.generating;
  $('lang-select').value = d.lang;
  $('intent-badge').innerHTML = wait ? `<span class="badge ${d.intent}">${d.intent}</span>` : '';
  const pct = Math.round(d.conf * 100);
  $('conf').className = `conf ${pct >= 80 ? 'hi' : pct >= 55 ? 'mid' : 'lo'}`;
  $('conf').textContent = live ? T.conf(pct) : '';

  const plabel = d.product ? pshort(d.product) : '';
  const held = d.ranked.filter((r) => r.needs).length;
  // Built lazily: `d.options` holds product keys for reason 'product' but plan names for 'plan'.
  const clarifyBanner = {
    product: () => `${T.bProduct(d.options.length < PRODUCT_KEYS.length ? d.options.map(pshort).join(T.sep) : '')}<button data-lookup>${T.lookupBtn}</button>`,
    plan: () => T.bPlan(plabel, held),
    info: () => T.bInfo,
  };
  const banner = d.intent === 'escalate' ? T.bEscalate : d.intent === 'clarify' ? clarifyBanner[d.reason]() : '';
  $('intent-banner').innerHTML = live && banner ? `<div class="intent-banner ${d.intent}">${banner}</div>` : '';
  renderWhy(s, d, live);

  ta.classList.toggle('generating', d.generating);
  ta.readOnly = d.generating;
  ta.disabled = !wait;
  if (ta.value !== d.text) ta.value = d.text;
  ta.placeholder = !wait ? T.phReplied : T.phGenerating;

  $('stale').hidden = !d.stale || !wait;
  $('stale-text').textContent = d.stale === 'context' ? T.staleCtx : T.staleSrc;
  $('btn-stale').textContent = d.stale === 'context' ? T.staleCtxBtn : T.staleSrcBtn;

  document.querySelectorAll('.toolbar button, #quick button').forEach((b) => (b.disabled = !live));
  document.querySelectorAll('#tone-group button').forEach((b) => b.classList.toggle('on', b.dataset.tone === d.tone));
  document.querySelectorAll('#quick button').forEach((b) => b.classList.toggle('suggest', live && d.intent === 'clarify' && b.dataset.ask === (d.reason === 'info' ? 'policy' : d.reason)));
  $('quick').hidden = !wait;
  renderCites();
  renderWarnings();
}

function renderWhy(s, d, live) {
  $('why').hidden = !live;
  if (!live) return;
  const c = s.ctx, o = s.origin;
  const reason = d.intent === 'escalate' ? T.rEscalate : d.intent === 'answer' ? T.rAnswer : T.rReason[d.reason];
  const ctxUsed = ['product', 'plan', 'policyNo', 'claimNo'].filter((f) => c[f])
    .map((f) => `${T.field[f]}: ${f === 'product' ? pshort(c[f]) : f === 'plan' ? planName(c[f]) : c[f]} (${T.origin[o[f]] || '—'})`);
  const held = d.ranked.filter((r) => r.needs).length;
  $('why-list').innerHTML = [
    T.wIntent(d.intent, reason),
    T.wCtx(ctxUsed.map(esc).join('; '), c.notes.length),
    T.wHits(d.ranked.length, d.selected.length, held),
  ].map((x) => `<li>${x}</li>`).join('');
}

function renderCites() {
  const d = draftState[state.active];
  if (d.generating) { $('cites').innerHTML = '<span class="loading-dots"><span></span><span></span><span></span></span>'; return; }
  if (!pending(session())) { $('cites').innerHTML = ''; return; }
  const text = $('draft').value;
  $('cites').innerHTML = d.selected.map((id, i) => {
    const k = kbById(id), present = text.includes(`[${i + 1}]`);
    return `<span class="cite-chip ${present ? '' : 'missing'}" data-cite="${id}" title="${present ? T.citeView : T.citeGone}">[${i + 1}] <span class="tag ${k.type}">${T.labels[k.type]}</span> ${esc(L(k.title))}</span>`;
  }).join('');
}

function renderWarnings() {
  const s = session(), d = draftState[s.id], text = $('draft').value, hits = [];
  if (pending(s) && !d.generating && text.trim()) {
    RISK_RULES.forEach((r) => { r.re.lastIndex = 0; if (r.re.test(text)) hits.push(r.msg); });
    if (d.intent === 'answer' && !d.selected.some((id, i) => text.includes(`[${i + 1}]`))) hits.push(T.noCite);
    const guessed = ['product', 'plan'].filter((f) => s.origin[f] === 'ai' && s.ctx[f]).map((f) => T.field[f]);
    if (guessed.length) hits.push(T.guessed(guessed.join(T.sep)));
  }
  $('warnings').hidden = !hits.length;
  $('warnings').innerHTML = hits.map((m) => `⚠ ${esc(m)}`).join('<br>');
}

function highlight(text, words) {
  let out = esc(text);
  words.filter((w) => w.length > 1).forEach((w) => {
    out = out.replace(new RegExp(esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), (m) => `<mark>${m}</mark>`);
  });
  return out;
}

// Where a knowledge item applies, flagged when it conflicts with / exceeds the current context.
function applicability(k, c) {
  if (k.type === 'policy') return { text: T.apPolicy(k.policyNo), warn: false };
  if (k.type === 'claim') return { text: T.apClaim(k.claimNo), warn: false };
  if (!k.product) return { text: T.apAll, warn: false };
  const text = T.ap(`${pshort(k.product)}${k.plan ? ` · ${planName(k.plan)}` : ''}`);
  if (!c.product) return { text: text + T.apNoProduct, warn: true };
  if (c.product !== k.product) return { text: text + T.apMismatch, warn: true };
  if (k.plan && !c.plan) return { text: text + T.apNoPlan, warn: true };
  if (k.plan && c.plan !== k.plan) return { text: text + T.apMismatch, warn: true };
  return { text, warn: false };
}

function cardHtml(k, d, s) {
  const idx = d.selected.indexOf(k.id), fb = d.feedback[k.id], ap = applicability(k, s.ctx);
  const rt = retrievalText(s), hitWords = k.kw.filter((w) => rt.includes(w.toLowerCase()));
  return `<div class="kb-card ${idx >= 0 ? 'used' : ''}" id="card-${k.id}">
    <div class="top">${idx >= 0 ? `<span class="cite-no">[${idx + 1}]</span>` : ''}<span class="tag ${k.type}">${T.labels[k.type]}</span><span class="title">${esc(L(k.title))}</span></div>
    <div class="src"><span>${esc(k.origin)}</span><span class="appl ${ap.warn ? 'warn' : ''}">${esc(ap.text)}</span></div>
    <div class="snippet">${highlight(L(k.snippet), hitWords)}</div>
    <div class="actions">
      <label><input type="checkbox" data-select="${k.id}" ${idx >= 0 ? 'checked' : ''} ${pending(s) ? '' : 'disabled'}/> ${T.use}</label>
      <button data-insert="${k.id}" title="${T.insertTitle}" ${pending(s) ? '' : 'disabled'}>${T.insert}</button>
      <button data-expand="${k.id}">${T.expand}</button>
      <span class="fb">
        <button data-fb="${k.id}" data-v="up" class="${fb === 'up' ? 'on' : ''}" title="${T.useful}">👍</button>
        <button data-fb="${k.id}" data-v="down" class="${fb === 'down' ? 'on' : ''}" title="${T.irrelevant}">👎</button>
        <button data-report="${k.id}" title="${T.reportTitle}">${T.report}</button>
      </span>
    </div></div>`;
}

function renderKb() {
  const s = session(), d = draftState[s.id];
  $('kb-search').hidden = state.tab !== 'search';
  document.querySelectorAll('.kb-tabs button').forEach((b) => b.classList.toggle('active', b.dataset.tab === state.tab));
  const related = d.ranked.filter((r) => !d.selected.includes(r.id)).map((r) => r.id);
  $('cnt-used').textContent = `(${d.selected.length})`;
  $('cnt-related').textContent = `(${related.length})`;
  let ids;
  if (state.tab === 'used') ids = d.selected;
  else if (state.tab === 'related') ids = related;
  else {
    const q = $('kb-q').value.trim().toLowerCase();
    ids = q ? MOCK_KB.filter((k) => [k.title.zh, k.title.en, k.snippet.zh, k.snippet.en, k.origin, k.plan ? planName(k.plan, 'zh') + ' ' + planName(k.plan, 'en') : '', ...k.kw].join(' ').toLowerCase().includes(q)).map((k) => k.id) : [];
  }
  const empty = {
    used: d.intent === 'clarify' ? T.emptyUsedClarify : T.emptyUsed,
    related: T.emptyRelated,
    search: $('kb-q').value ? T.emptySearchNone : T.emptySearch,
  }[state.tab];
  $('kb-list').innerHTML = d.generating && state.tab !== 'search' ? `<div class="empty">${T.retrieving}</div>`
    : (ids.length ? ids.map((id) => cardHtml(kbById(id), d, s)).join('') : `<div class="empty">${empty}</div>`);
}

function renderStats() {
  const avg = state.editRates.length ? Math.round(100 * state.editRates.reduce((a, b) => a + b, 0) / state.editRates.length) + '%' : '—';
  $('stats').innerHTML = T.stats(state.sent, avg, state.kbReports);
}

function render() { renderQueue(); renderContext(); renderConversation(); renderDraft(); renderKb(); renderStats(); }

function openModal(title, bodyHtml, actions) {
  $('modal-title').textContent = title;
  $('modal-body').innerHTML = bodyHtml;
  $('modal-actions').innerHTML = '';
  actions.forEach(([label, cls, fn]) => {
    const b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls;
    b.onclick = () => { if (fn() !== false) closeModal(); };
    $('modal-actions').appendChild(b);
  });
  $('modal').classList.add('open');
}
function closeModal() { $('modal').classList.remove('open'); }

function openLookup() {
  const s = session();
  openModal(T.lkTitle, `
    <input id="lk-q" value="${esc(s.lookup)}" placeholder="${T.lkPh}" />
    <div id="lk-res" style="display:flex;flex-direction:column;gap:8px"></div>
    <p class="note">${T.lkNote}</p>`,
    [[T.close, 'primary', () => {}]]);
  const run = () => {
    const q = norm($('lk-q').value);
    const found = q ? MOCK_CRM.filter((cu) => [cu.name, cu.phone, ...cu.policies.map((p) => p.no), ...cu.claims.map((t) => t.no)].some((v) => norm(v).includes(q))) : [];
    const added = (no) => no === s.ctx.policyNo || no === s.ctx.claimNo;
    const btn = (kind, no) => added(no) ? `<button disabled>${T.added}</button>` : `<button class="primary" data-attach="${kind}" data-no="${no}">${T.addCtx}</button>`;
    $('lk-res').innerHTML = !q ? `<div class="empty">${T.lkEmpty}</div>` : !found.length ? `<div class="empty">${T.lkNone}</div>`
      : found.map((cu) => `<div class="lk-cust"><div class="lk-name">${esc(cu.name)}<span>${esc(cu.phone)}</span></div>
          ${cu.policies.map((p) => `<div class="lk-row"><span class="tag policy">${T.tPolicy}</span><code>${p.no}</code>
            <span class="desc">${pshort(p.product)} · ${esc(planName(p.plan))} · ${L(p.status)} · ${esc(p.period)}</span>${btn('policy', p.no)}</div>`).join('')}
          ${cu.claims.map((t) => `<div class="lk-row"><span class="tag claim">${T.tClaim}</span><code>${t.no}</code>
            <span class="desc">${esc(L(t.type))} · ${esc(L(t.status))} · ${T.tPolicy} ${t.policyNo}</span>${btn('claim', t.no)}</div>`).join('')}
        </div>`).join('');
  };
  $('lk-q').oninput = run; run(); if (!TOUR) $('lk-q').focus();
  $('lk-res').onclick = (e) => {
    const b = e.target.closest('[data-attach]'); if (!b) return;
    attachRecord(b.dataset.attach, b.dataset.no); closeModal();
  };
}

function attachRecord(kind, no) {
  const s = session(), c = s.ctx, o = s.origin;
  const claim = kind === 'claim' ? MOCK_CRM.flatMap((cu) => cu.claims).find((x) => x.no === no) : null;
  const policy = MOCK_CRM.flatMap((cu) => cu.policies).find((p) => p.no === (claim ? claim.policyNo : no));
  Object.assign(c, { policyNo: policy.no, product: policy.product, plan: policy.plan });
  Object.assign(o, { policyNo: 'lookup', product: 'lookup', plan: 'lookup' });
  if (claim) { c.claimNo = claim.no; o.claimNo = 'lookup'; }
  toast(T.attached(claim?.no, policy.no, `${pshort(policy.product)} · ${planName(policy.plan)}`));
  onContextChanged(kind, no);
}

function reportKb(kbId) {
  const k = kbId && kbById(kbId);
  openModal(k ? T.repTitle(L(k.title)) : T.repGap, `
    <select id="rep-type">${(k ? T.repTypes : T.repGapTypes).map((x) => `<option>${x}</option>`).join('')}</select>
    <textarea id="rep-note" placeholder="${T.repPh}">${k ? '' : esc(T.repQ + lastCustomer(session()))}</textarea>`,
    [[T.cancel, 'ghost', () => {}],
     [T.submit, 'primary', () => {
       state.kbReports++;
       logFeedback({ type: 'kb_report', kb_id: kbId || null, reason: $('rep-type').value, note: $('rep-note').value, ctx: { ...session().ctx } });

     }]]);
}

  const f = e.target.dataset.field; if (!f) return;
  const s = session(), c = s.ctx, v = e.target.value;
  c[f] = v; s.origin[f] = 'agent';
  if (f === 'product' && c.plan && !(v && PRODUCTS[v].plans.some((p) => p.id === c.plan))) { c.plan = ''; s.origin.plan = undefined; }

  else if (t.dataset.clear) { s.ctx[t.dataset.clear] = ''; s.origin[t.dataset.clear] = 'agent'; onContextChanged(t.dataset.clear, ''); }

$('sim-send').onclick = customerSend;
$('sim-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') customerSend(); });

$('draft').addEventListener('input', () => { draftState[state.active].text = $('draft').value; renderCites(); renderWarnings(); });
$('draft').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $('btn-send').click(); } });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
  if (e.altKey && (e.key === 'r' || e.key === 'R') && !$('btn-regen').disabled) { e.preventDefault(); $('btn-regen').click(); }
});

$('lang-select').onchange = () => { draftState[state.active].lang = $('lang-select').value; recompose(); };
document.querySelectorAll('#tone-group button').forEach((b) => b.onclick = () => { draftState[state.active].tone = b.dataset.tone; recompose(); });
$('btn-regen').onclick = () => generate(state.active, { keepSelection: true });
$('btn-stale').onclick = () => (draftState[state.active].stale === 'context' ? generate(state.active) : recompose());
$('btn-undo').onclick = () => { const d = draftState[state.active]; d.text = d.original; renderDraft(); };

$('quick').addEventListener('click', (e) => {
  const b = e.target.closest('[data-ask]'); if (!b) return;
  const s = session(), d = draftState[s.id], P = PHRASES[d.lang], ta = $('draft');
  let q = P.quick[b.dataset.ask];
  if (b.dataset.ask === 'plan' && s.ctx.product) q += '\n' + PRODUCTS[s.ctx.product].plans.map((p, i) => `${i + 1}. ${planName(p.id, d.lang)}`).join('\n');
  if (b.dataset.ask === 'product') q = `${P.askProduct}\n${PRODUCT_KEYS.map((k, i) => `${i + 1}. ${PRODUCTS[k].label[d.lang]}`).join('\n')}`;
  const pos = ta.selectionStart ?? ta.value.length, before = ta.value.slice(0, pos);
  ta.value = before + (before && !before.endsWith('\n') ? '\n\n' : '') + q + ta.value.slice(pos);
  d.text = ta.value; renderCites(); renderWarnings(); ta.focus();
  logFeedback({ type: 'quick_ask', ask: b.dataset.ask });
});

$('btn-send').onclick = () => {
  const s = session(), d = draftState[s.id], text = $('draft').value.trim();
  if (!text) return toast(T.emptyDraft);
  const rate = editRate(d.original, text);
  s.messages.push({ role: 'agent', text });
  state.sent++; state.editRates.push(rate);
  logFeedback({ type: 'sent', intent: d.intent, reason: d.reason || null, lang: d.lang, ctx: { ...s.ctx }, ctx_origin: { ...s.origin },
                sources: d.selected, cited_in_final: d.selected.filter((id, i) => text.includes(`[${i + 1}]`)),
                edit_rate: Math.round(rate * 1000) / 1000, ai_draft: d.original, final: text });
  d.text = ''; d.original = ''; d.stale = null;
  toast(T.sentToast(Math.round(rate * 100)));
  render();
};

document.querySelectorAll('.kb-tabs button').forEach((b) => b.onclick = () => { state.tab = b.dataset.tab; renderKb(); if (state.tab === 'search') $('kb-q').focus(); });
$('kb-q').addEventListener('input', renderKb);

$('kb-list').addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return;
  const d = draftState[state.active];
  if (t.dataset.insert) {
    const ta = $('draft'), k = kbById(t.dataset.insert), pos = ta.selectionStart ?? ta.value.length;
    ta.value = ta.value.slice(0, pos) + L(k.snippet) + ta.value.slice(pos);
    d.text = ta.value; renderCites(); renderWarnings();
    logFeedback({ type: 'insert_snippet', kb_id: k.id });
  } else if (t.dataset.expand) {
    const sn = t.closest('.kb-card').querySelector('.snippet'); sn.classList.toggle('open'); t.textContent = sn.classList.contains('open') ? T.collapse : T.expand;
  } else if (t.dataset.fb) {
    d.feedback[t.dataset.fb] = d.feedback[t.dataset.fb] === t.dataset.v ? undefined : t.dataset.v;
    logFeedback({ type: 'source_rating', kb_id: t.dataset.fb, rating: d.feedback[t.dataset.fb] || null });
    renderKb();
  } else if (t.dataset.report) reportKb(t.dataset.report);
});
$('kb-list').addEventListener('change', (e) => {
  const id = e.target.dataset.select; if (!id) return;
  const d = draftState[state.active];
  d.selected = e.target.checked ? [...d.selected, id] : d.selected.filter((x) => x !== id);
  d.stale = d.stale || 'sources';
  logFeedback({ type: e.target.checked ? 'source_added' : 'source_removed', kb_id: id });
  renderDraft(); renderKb();
});

$('cites').addEventListener('click', (e) => {
  const chip = e.target.closest('[data-cite]'); if (!chip) return;
  state.tab = 'used'; renderKb();
  const card = $('card-' + chip.dataset.cite);
  card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  card.classList.add('flash'); setTimeout(() => card.classList.remove('flash'), 1200);
});

$('btn-gap').onclick = () => reportKb(null);
$('btn-log').onclick = () => openModal(T.logTitle(state.feedback.length),
  `<p class="note">${T.logNote}</p><pre class="log">${esc(JSON.stringify(state.feedback, null, 2))}</pre>`,
  [[T.download, '', () => {
     const a = document.createElement('a');
     a.href = URL.createObjectURL(new Blob([JSON.stringify(state.feedback, null, 2)], { type: 'application/json' }));
     a.download = 'agent-assist-feedback.json'; a.click(); return false;
   }], [T.close, 'primary', () => {}]]);
$('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });

// Normalised Levenshtein distance between the AI draft and what the agent sent.
function editRate(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (!m || !n) return 1;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n] / Math.max(m, n);
}

// Boot: every waiting conversation gets a draft prepared up front.
function boot() {
  SESSIONS.forEach((s) => { if (s.id !== state.active) generate(s.id); });
  generate(state.active);
}
boot();

// ---------------------------------------------------------------------------
// Tour mode: the slide deck in the blog post sends {tour: 'step', id} via
// postMessage; each step starts from a fresh state so slides can be visited in
// any order. Highlights mark what the slide is talking about.
// ---------------------------------------------------------------------------
function resetDemo() {
  closeModal();
  SESSIONS.splice(0, SESSIONS.length, ...buildSessions());
  Object.keys(draftState).forEach((k) => delete draftState[k]);
  Object.assign(state, { active: 's1', tab: 'used', ctxOpen: true, feedback: [], sent: 0, editRates: [], kbReports: 0 });
  $('kb-q').value = '';
  boot();
}
const openSession = (sid) => { state.active = sid; render(); };
const customerSays = (text) => { const s = session(); s.messages.push({ role: 'customer', text }); s.wait = 0; generate(s.id); };
const STEPS = {
  layout: { run: () => {}, hl: [] },
  citations: { run: () => {}, hl: ['#cites', '#draft', '#kb-list .kb-card:first-child'] },
  'clarify-plan': { run: () => openSession('s5'), hl: ['#intent-banner .intent-banner', '#draft'] },
  held: { run: () => { openSession('s5'); state.tab = 'related'; renderKb(); }, hl: ['#kb-list .appl.warn'] },
  'infer-plan': { run: () => { openSession('s5'); customerSays(UI === 'en' ? 'I have Voyager Overseas' : '我买的是畅游境外版'); },
                  hl: ['.ctx-grid .val:nth-of-type(2)', '#warnings'] },
  'clarify-product': { run: () => openSession('s4'), hl: ['#intent-banner .intent-banner', '.ctx-warn'] },
  lookup: { run: () => { openSession('s4'); openLookup(); }, hl: ['.modal'] },
  attached: { run: () => { openSession('s4'); attachRecord('policy', 'TRV-2026-0090017'); }, hl: ['.ctx-grid', '#draft'] },
  escalate: { run: () => openSession('s3'), hl: ['#intent-banner .intent-banner', '.queue-item.active'] },
  guardrails: { run: () => { const d = draftState.s1; d.text += UI === 'en' ? ' This is guaranteed to be paid.' : '我们保证一定赔付。'; $('draft').value = d.text; renderWarnings(); },
                hl: ['#warnings'] },
  feedback: { run: () => { $('btn-send').click(); $('btn-log').click(); }, hl: ['.modal', '#stats'] },
};
if (TOUR) {
  document.body.classList.add('tour');
  addEventListener('message', (e) => {
    if (e.source !== parent || e.data?.tour !== 'step') return;
    const step = STEPS[e.data.id]; if (!step) return;
    resetDemo(); step.run();
    document.querySelectorAll('.hl').forEach((el) => el.classList.remove('hl'));
    step.hl.forEach((sel) => document.querySelectorAll(sel).forEach((el) => el.classList.add('hl')));
  });
  parent.postMessage({ tour: 'ready' }, '*');
}
</script>
