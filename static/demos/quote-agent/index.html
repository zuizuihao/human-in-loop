    set of controlled UI cards (needs, payment, trim options, details form, review, summary).

    come from a mock pricing / finance service inside this file; intent understanding is a
    handful of local rules. No network calls, no LLM, no persistence. Not affiliated with
    any of the brands; check the official sites for real prices.

    /* Conversation surfaces share the transcript, with one active interaction at a time. */
    body{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
    header{height:68px;flex-shrink:0}.demo-strip{flex-shrink:0}
    .layout{display:flex;flex:1;height:auto;min-height:0;justify-content:center;overflow:hidden}
    .assistant{width:100%;max-width:980px;background:transparent;border:0;min-width:0}
    .assistant-head{padding:17px 30px 13px;background:var(--paper);flex-shrink:0;border-bottom:1px solid var(--line)}
    .assistant-title{margin:0}.assistant-heading{display:flex;justify-content:space-between;align-items:center;gap:15px}
    .assistant-title h1{font-size:16px;letter-spacing:0;font-weight:650}
    .assistant-title .sub{font-size:11px;margin:0}
    .steps{margin:14px 0 0;padding-left:50px;gap:12px}.step-line{width:50px}
    .context-summary{font-size:11px;color:var(--green);text-align:right}
    .messages{padding:25px 30px 35px;min-height:0;max-height:none;overflow:auto;scroll-behavior:auto;overflow-anchor:none}
    .message{max-width:720px;margin-bottom:20px}
    .message.user{max-width:460px;margin-left:auto}
    .bubble{display:inline-block;background:#fff;border-color:var(--line);font-size:14px;padding:14px 18px}
    .user .bubble{display:block}.mini-event{display:inline-block;background:transparent;padding:4px 0;font-size:10px}
    #surface{margin:0 0 20px;scroll-margin-top:18px}
    .surface-label{font-size:10px;letter-spacing:1px;color:var(--muted);margin:0 0 10px 2px}
    .surface-body{background:#fff;border:1px solid var(--line);border-radius:3px 18px 18px;padding:22px;box-shadow:var(--shadow)}
    .surface-body>.panel{border:0;box-shadow:none;padding:0;margin:0}
    .surface-body>.notice{margin-bottom:18px}
    .surface-body>.empty{padding:22px;margin-top:16px}
    .panel-head{gap:10px}.panel-head .pill{font-size:10px}
    .needs-summary{border:1px solid var(--line);background:#f8faf4;border-radius:9px;margin-bottom:22px}
    .needs-summary summary{cursor:pointer;padding:12px 15px;font-size:12px}
    .needs-summary .panel{border:0;box-shadow:none;margin:0;padding:16px;background:transparent}
    .results-title h2{font-size:15px}.plan{cursor:default}
    .chat-bottom{flex-shrink:0;background:var(--paper);padding:13px 30px 16px}
    .compose{background:#fff;box-shadow:var(--shadow);padding:10px}
    .compose input{padding:6px 8px}.send{width:37px}.chat-note{text-align:center}
    .history-card{border:1px solid var(--line);background:#f1f5eb;border-radius:10px;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;gap:15px}
    .history-card strong{font-size:12px}.history-card p{font-size:11px;color:var(--muted);margin-top:3px}
    .history-card button{background:#fff;color:var(--green);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:11px;white-space:nowrap}
    .history-status{font-size:10px;color:var(--muted)}.history-card.stale{background:#f4f2eb;border-style:dashed}
    .history-card.stale .history-status{color:var(--orange)}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
    .intent-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
    .intent-tile{text-align:left;padding:20px;border:1px solid var(--line);border-radius:12px;background:#fafcf6;color:var(--ink);transition:border-color .15s,background .15s}
    .intent-tile:hover{border-color:var(--green);background:#f0f6e5}.intent-tile b{display:block;font-size:16px;margin:10px 0 4px}.intent-tile span{font-size:12px;color:var(--muted)}
    .intent-icon{font-size:24px;color:var(--green)}.helper-line{font-size:11px;color:var(--muted);margin:10px 0}
    .usage-options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
    .usage-choice{background:#f7f9f2;color:var(--green);border:1px solid var(--line);border-radius:9px;padding:12px 8px;font-size:12px}
    .usage-choice.on{border-color:var(--green);background:#edf5df}
    .filter-bar{display:flex;align-items:center;gap:8px;margin:13px 0 17px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
    .filter-bar .chip.on{background:var(--green);border-color:var(--green);color:white}
    .match-note{background:#f0f5e7;padding:8px 11px;border-radius:7px;margin:0 0 14px;font-size:11px;color:var(--green)}
    .plan .benefit{margin:8px 0}.plan hr{margin:10px 0}.plan .benefit strong{font-size:16px}
    .plans.two-options{grid-template-columns:repeat(2,minmax(0,1fr))}
    .plans.one-option:not(.family){grid-template-columns:1fr;max-width:520px}
    .plan-detail{font-size:11px;border-top:1px solid var(--line);padding-top:10px;margin:12px 0}.plan-detail summary{cursor:pointer;color:var(--green)}
    .plan-detail p{color:var(--muted);margin-top:7px}.plan .select-plan{padding:10px 6px}
    .source-detail{font-size:11px;color:var(--muted);margin-top:14px}.source-detail summary{cursor:pointer}.source-detail p{padding:10px 0}
    .draft{display:flex;justify-content:space-between;align-items:center;gap:14px;border:1px solid #d5e0c8;background:#f5f8ee;border-radius:10px;padding:13px 16px;margin-bottom:20px}
    .draft strong{font-size:14px}.draft small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.draft-price{font-size:20px;font-weight:600;white-space:nowrap}
    .draft .text-button{font-size:11px;padding:0;margin-top:5px}
    .edit-row{display:flex;gap:10px;justify-content:flex-end;margin-bottom:15px}
    .edit-row button{font-size:11px;padding:6px 10px}.result-count{font-size:11px;color:var(--muted);margin-bottom:13px}
    .quote-progress{display:flex;align-items:center;gap:15px;padding:15px;font-size:12px;background:#f4f7ed;border-radius:10px}
    .spinner{height:20px;width:20px;border:2px solid #d5e0c6;border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite}
    .new-update{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);border:1px solid var(--line);background:var(--green);color:white;border-radius:30px;font-size:11px;padding:9px 16px;box-shadow:0 4px 20px #19392f25}
    .transcript-shell{position:relative;display:flex;flex:1;min-height:0}.transcript-shell .messages{width:100%}
    .reference-card{border:1px solid var(--line);padding:16px;border-radius:10px;margin-bottom:12px}.reference-card h3{margin-bottom:6px}.reference-card p{font-size:12px;color:var(--muted);margin-bottom:6px}
    .needs-summary{margin-bottom:14px}.needs-summary summary{padding:10px 13px}
    .filter-bar{margin:9px 0 12px}.match-note{margin-bottom:10px}
    .plan{padding:16px}.plan h3{font-size:15px;margin:4px 0 8px}.price{font-size:28px}
    .price-caption{min-height:0;margin-top:3px}.plan hr{margin:9px 0}
    .plans:not(.family) .plan>div:first-child{display:grid;grid-template-columns:1fr auto;column-gap:8px}
    .plans:not(.family) .plan-kicker{grid-column:1;grid-row:1}
    .plans:not(.family) .plan h3{grid-column:1;grid-row:2}
    .plans:not(.family) .price{grid-column:2;grid-row:1/3;align-self:center}
    .plans:not(.family) .price-caption{grid-column:1/-1}
    .plan .benefit{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:7px 0;font-size:10px}
    .plan .benefit strong{font-size:15px;white-space:nowrap;margin:0}
    .family .plan .benefit{display:block}.family .plan .benefit strong{margin-top:5px}
    .plan-detail{margin:8px 0;padding-top:8px}
    .payment-choices{display:grid;gap:12px;margin:18px 0 12px}
    .payment-choice{display:flex;align-items:center;gap:16px;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:18px;background:#fafcf6;color:var(--ink)}
    .payment-choice:hover{border-color:var(--green);background:#eff6e4}.payment-choice .payment-icon{display:grid;place-items:center;flex-shrink:0;width:42px;height:42px;border-radius:12px;background:#e8f0db;font-size:13px;font-weight:650}
    .payment-choice strong{display:block;font-size:17px}.payment-choice small{display:block;font-size:12px;color:var(--muted);margin-top:3px}.payment-choice .arrow{margin-left:auto;font-size:20px}
    .payment-receipt{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:0 0 12px;margin-bottom:16px;font-size:12px}

    // ----- local intent rules (stand-in for an agent) ----------------------------
    function parseNeeds(text){
      const t=text.replace(/(\d),(\d{3})/g,'$1$2');
      const out={};
      if(/小米|su7|xiaomi/i.test(t))out.model='su7';
      else if(/蔚来|et5|nio/i.test(t))out.model='et5';
      else if(/比亚迪|海豹|byd|seal/i.test(t))out.model='seal';
      else if(/不限车型|帮我挑|都可以|随便|any model|help me pick/i.test(t))out.model='any';
      const city=[['sh',/上海|shanghai/i],['bj',/北京|beijing/i],['sz',/深圳|shenzhen/i],['hz',/杭州|hangzhou/i],['other',/其他城市|别的城市|other city/i]].find(([,re])=>re.test(t));
      if(city)out.city=city[0];
      if(/全款|一次性|现金|pay in full|full payment|cash/i.test(t))out.payment='full';
      else if(/分期|贷款|月供|按揭|loan|financ/i.test(t))out.payment='loan';
      if(/租电|电池租用|租用电池|baas|battery rental|rent the battery/i.test(t))out.battery='rent';
      else if(/买断|buy the battery/i.test(t))out.battery='buy';
      const range=t.match(/续航\D{0,6}?(\d{3,4})|(\d{3,4})\s*(?:公里|km)/i);
      if(range)out.minRange=Number(range[1]||range[2]);
      const zhBudget=t.match(/(-?\d+(?:\.\d+)?)\s*万/);
      const enBudget=t.match(/(?:budget|under|up to|below|max)\D{0,6}?(-?\d+(?:\.\d+)?)\s*(k)?/i);
      if(zhBudget)out.budget=Number(zhBudget[1])*10000;
      else if(enBudget){const n=Number(enBudget[1]);out.budget=enBudget[2]?n*1000:n<1000?n*10000:n;}
      // Fuzzy phrases → inferred conditions (shown as dashed “AI inferred” chips, never silently applied).
      out.inferred={};
      if(out.budget===undefined && /(二十|20)\s*(来|多|左右)\s*万|around\s*¥?\s*200k/i.test(t)){out.budget=250000;out.inferred.budget={value:250000,reason:tx('“二十来万”按 25 万以内理解','“around ¥200k” read as up to ¥250k')};}
      if(out.minRange===undefined && /高速|长途|跑得远|经常出差|highway|long trips|road trips/i.test(t)){out.minRange=650;out.inferred.minRange={value:650,reason:tx('你提到经常跑高速 / 长途','you mentioned highway or long trips')};}
      if(/加速|推背|性能|sporty|performance|quick acceleration/i.test(t)){out.maxAccel=4.0;out.inferred.maxAccel={value:4.0,reason:tx('你提到想要加速快','you want quick acceleration')};}
      return out;
    }
    function mentionedTrims(t){
      const out=[],add=id=>{const tr=ALL_TRIMS.find(x=>x.id===id);if(tr && !out.includes(tr))out.push(tr);};
      const parts=t.split(/和|与|跟|还是|对比|vs\.?|versus|and|or|,|，/i);
      for(const part of parts){
        if(/su7|小米|xiaomi/i.test(part)){if(/max/i.test(part))add('su7-max');else if(/pro/i.test(part))add('su7-pro');else if(/标准|standard/i.test(part))add('su7-std');}
        if(/et5|蔚来|nio/i.test(part)){if(/100/.test(part))add('et5-100');else if(/75/.test(part))add('et5-75');}
        if(/海豹|seal|比亚迪|byd/i.test(part)){if(/550/.test(part))add('seal-550');else if(/650/.test(part))add('seal-650');else if(/四驱|awd/i.test(part))add('seal-awd');}
      }
      return out;
    }
    // Grounded explanation: every number in the text must come from service data, checked before showing.
    function explainDiff(a,b,text){
      const qa=quoteFor(a),qb=quoteFor(b),n=x=>trimName(x);
      const diff=Math.abs(qa.car-qb.car),cheaper=qa.car<=qb.car?a:b,longer=a.range>=b.range?a:b;
      const lines=[tx(`${n(a)} 和 ${n(b)}：`,`${n(a)} vs ${n(b)}:`),
        tx(`· 指导价 ${wan(qa.car)} vs ${wan(qb.car)}，${n(cheaper)} 便宜 ${wan(diff)}`,`· MSRP ${wan(qa.car)} vs ${wan(qb.car)}; ${n(cheaper)} is ${wan(diff)} cheaper`),
        tx(`· 落地价估算 ${wan(qa.landed)} vs ${wan(qb.landed)}`,`· On the road (est.) ${wan(qa.landed)} vs ${wan(qb.landed)}`),
        tx(`· CLTC 续航 ${a.range} km vs ${b.range} km`,`· CLTC range ${a.range} km vs ${b.range} km`),
        tx(`· 百公里加速 ${a.accel.toFixed(1)} s vs ${b.accel.toFixed(1)} s`,`· 0–100 km/h ${a.accel.toFixed(1)} s vs ${b.accel.toFixed(1)} s`)];
      if(qa.rent||qb.rent)lines.push(tx('· 租电车型另付电池月租，不计入落地价','· battery-rental trims add a monthly battery fee outside the on-the-road price'));
      lines.push(/高速|长途|highway|long/i.test(text)?tx(`常跑高速的话，续航更长的是 ${n(longer)}；但 CLTC 是工况值，实际会更短。选哪个由你决定。`,`For lots of highway driving, ${n(longer)} has the longer range — but CLTC is a test-cycle figure. The choice is yours.`):tx('更看重价格还是续航，决定了选哪一个；选择留给你。','Whether price or range matters more decides which one fits — the choice is yours.'));
      const msg=lines.join('\n');
      const facts=new Set(['0','100']);
      [a,b].forEach(t=>{const q=quoteFor(t);[wan(q.car),wan(q.landed),wan(diff),yuan(q.rent)].forEach(v=>v.match(/\d[\d,.]*/g)?.forEach(x=>facts.add(x)));[t.range,t.accel.toFixed(1)].forEach(x=>facts.add(String(x)));t.label.match(/\d+/g)?.forEach(x=>facts.add(x));(t.car.name.match(/\d+/g)||[]).forEach(x=>facts.add(x));});
      const nums=msg.match(/\d[\d,.]*\d|\d/g)||[];
      const bad=nums.filter(x=>!facts.has(x));
      if(bad.length){addMessage(tx('有数字无法和报价服务数据核对，这段解释已被拦下。','Some numbers could not be checked against the pricing data, so this explanation was blocked.'));return;}
      addMessage(msg,false,tx(`引用 ${nums.length} 个数字 · 均与报价服务数据一致`,`cites ${nums.length} numbers · all match the pricing data`),'ai-explain');
    }
    function handlePrompt(text) {

      const command=text.trim().replace(/[。！!，,？?.\s]+$/g,'');
      const RESTART=/^(?:重新询价|重新开始|开始新的?询价|restart|start over|new quote)$/i;
      if(state.confirmed){if(RESTART.test(command))reset();else addMessage(tx('本次演示已结束，不会再修改旧订单。点击“开始新询价”开始新的需求。','This demo has finished and the old order will not change. Use “Start a new quote” for new needs.'));return;}
      if(/@|\d{7,}|身份证|驾驶证|证件号|银行卡|passport|licen[cs]e number|card number|\bID number/i.test(text)){addMessage(tx('请勿在对话中填写手机号或证件资料。资料只在受控表单里填写，而且仅限虚构演示内容。','Please do not type phone or ID details into the chat. Details go only into the controlled form, and only fictional demo data.'));return;}
      if(/^(?:先暂停|暂停(?:询价|一下|本次询价)?|先停一下|我再考虑一下|稍后再看|pause|hold on|not now|later)$/i.test(command)){
        if(state.flow==='active' && state.started)pauseFlow();else addMessage(state.flow==='paused'?tx('询价已经暂停，没有后台任务。','The quote is already paused; nothing runs in the background.'):tx('当前没有进行中的询价，可以开始新询价。','There is no quote in progress; you can start a new one.'));return;
      }
      if(/^(?:(?:结束|中止|终止|取消)(?:本次|这个)?询价|end(?: the)? quote|cancel(?: the)? quote)$/i.test(command)){requestEndFlow();return;}
      if(/^(?:继续|继续询价|继续本次询价|resume|continue)$/i.test(command) && state.flow==='paused'){resumeFlow();return;}
      if(state.flow==='ended' && RESTART.test(command)){reset();return;}
      if(state.flow!=='active'){
        if(explain(text))return;
        addMessage(state.flow==='paused'?tx('询价保持暂停，需求没有修改。请点“继续本次询价”再修改，或继续提问。','The quote stays paused and nothing changed. Resume it to make changes, or keep asking.'):tx('本次询价已经结束，旧草稿不可继续。可开始新询价，或继续提问。','This quote has ended and the old draft cannot continue. Start a new quote, or keep asking.'));return;
      }
      const pair=mentionedTrims(text);
      const shown=state.quote?modelTrims().filter(matches):[];
      if(pair.length>=2 || (/区别|对比|差别|哪个好|哪个更|difference|which (?:one|is better)|\bvs\b/i.test(text) && shown.length>=2)){
        const [a,b]=pair.length>=2?pair:shown;
        explainDiff(a,b,text);
        lastTrace={input:text,intent:'compare_trims',toolCalls:[{tool:'get_trims',args:{ids:[a.id,b.id]}},{tool:'get_quote',args:{ids:[a.id,b.id],payment:state.payment,battery:state.battery}}],modelOutput:'explanation text (numbers checked against tool results before display)',rendered:['message']};
        render();return;
      }
      const n=parseNeeds(text);
      if(n.budget!==undefined && !(n.budget>0)){addMessage(tx('预算需要大于 0；当前需求没有变更。','The budget must be above 0; nothing was changed.'));return;}
      const needPatch={}; NEEDS_KEYS.forEach(k=>{if(n[k]!==undefined && n[k]!==state[k])needPatch[k]=n[k];});
      const filterPatch={}; FILTER_KEYS.forEach(k=>{if(n[k]!==undefined)filterPatch[k]=n[k];});
      const inferred=n.inferred||{};
      if(!Object.keys(needPatch).length && !Object.keys(filterPatch).length){if(explain(text))return;addMessage(tx('这是有限意图的本地模拟，还不能理解这句话。可以点卡片，或说“预算 25 万以内，杭州上牌，全款”；没有信息被发送给 AI 服务。','This is a local simulation with a limited set of intents, and it did not understand that. Use the cards, or say “under ¥250k, plates in Hangzhou, full payment”; nothing is sent to an AI service.'));return;}
      const explicitFilters=Object.fromEntries(Object.entries(filterPatch).filter(([k])=>!inferred[k]));
      lastTrace={input:text,intent:'update_needs',toolCalls:[...(Object.keys(needPatch).length?[{tool:'update_needs',args:needPatch}]:[]),...(Object.keys(explicitFilters).length?[{tool:'set_filters',args:explicitFilters}]:[]),...(Object.keys(inferred).length?[{tool:'propose_inferred_filters',args:Object.fromEntries(Object.entries(inferred).map(([k,v])=>[k,{value:v.value,reason:v.reason}])),note:'shown as dashed chips; user confirms or removes'}]:[])],missing:[!(needPatch.city||state.city)&&'city',!(needPatch.payment||state.payment)&&'payment'].filter(Boolean)};
      const got=[n.model&&MODELS[n.model],n.city&&cityText(n.city),n.payment&&PAYMENTS[n.payment],n.battery==='rent'&&tx('租电','battery rental'),...FILTER_KEYS.filter(k=>n[k]!==undefined).map(k=>(inferred[k]?tx('推断 ','inferred ')+condLabel(k,n[k]):condLabel(k,n[k])))].filter(Boolean);
      const inferNote=Object.keys(inferred).length?tx(' 带“推断”的条件是我根据你的描述猜的，请在卡片里确认或删掉。',' Conditions marked “inferred” are my guesses from what you said — confirm or remove them on the card.'):'';
      if(Object.keys(needPatch).length || !state.started){
        if(needPatch.battery)quoteChange='battery';
        updateNeeds({...needPatch,...filterPatch},false,inferred);
        addMessage(tx(`已记录：${got.join('，')}。${!state.city?'还差上牌城市：它影响落地价和交付门店，我不会按定位去猜。':!state.payment?'接下来选全款还是分期。':'正在请求报价。'}`,`Recorded: ${got.join(', ')}. ${!state.city?'I still need the plate city — it affects the on-the-road price and delivery centre, and I will not guess it from your location.':!state.payment?'Next: full payment or financing?':'Requesting prices.'}`)+inferNote);
        requestQuote();
        lastTrace.rendered=components().map(c=>c.component);lastTrace.toolCalls.push({tool:'request_quote',args:{}});render();return;
      }
      applyFilter(filterPatch,inferred);
      addMessage(tx(`已按条件筛选：${got.join('，')}。只按条件筛选，不代表推荐。`,`Filtered: ${got.join(', ')}. Filtered by your conditions — not a recommendation.`)+inferNote);
      lastTrace.rendered=components().map(c=>c.component);render();
    }
    function explain(text){
      if(/落地|购置税|上牌费|on-the-road|purchase tax/i.test(text)){addMessage(tx('落地价 = 车价 + 购置税（2026 年起新能源车减半征收，示例按此估算）+ 上牌服务费；保险另计。分期时还要看首付和月供。','On-the-road price = car price + purchase tax (halved for NEVs from 2026; the sample uses that) + registration fee; insurance is extra. With financing, also check the down payment and monthly payment.'));return true;}
      if(/续航|cltc|range/i.test(text)){addMessage(tx('卡片上的续航是 CLTC 工况值，冬季和高速的实际续航会更短。我已打开参数比较。','The range on the cards is the CLTC test-cycle figure; real range in winter or on highways is shorter. I opened the spec comparison.'),false,tx('打开参数比较','opened the spec comparison'));$('compare-dialog').showModal();return true;}
      if(/比较|区别|compare|difference/i.test(text)){$('compare-dialog').showModal();addMessage(tx('已打开参数比较。注意 CLTC 续航和指导价各自的口径。','Opened the spec comparison. Note what CLTC range and MSRP each mean.'));return true;}
      return false;
    }

    // ----- events ------------------------------------------------------------------
    $('chat-form').addEventListener('submit',e=>{e.preventDefault();const text=$('chat-input').value.trim();if(text){$('chat-input').value='';handlePrompt(text);}});
    $('dock-menu').addEventListener('click',e=>{
      const button=e.target.closest('[data-dock]');if(!button)return;
      $('dock-more').open=false;followConversation=true;$('new-update').classList.add('hide');
      performAction(button.dataset.dock);
    });
    function openToolDialog(id){$('tools-menu').open=false;$(id).showModal();}
    $('references').addEventListener('click',()=>openToolDialog('references-dialog'));
    $('inspect').addEventListener('click',()=>openToolDialog('mechanism-dialog'));
    $('demo-details').addEventListener('click',()=>openToolDialog('about-dialog'));
    document.addEventListener('click',e=>{if(!e.target.closest('#tools-menu'))$('tools-menu').open=false;if(!e.target.closest('#dock-more'))$('dock-more').open=false;});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('tools-menu').open=false;$('dock-more').open=false;}});
    document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>$(b.dataset.close).close()));
    $('end-confirm').addEventListener('click',endFlow);
    $('surface').addEventListener('change',e=>{
      const map={'need-model':'model','need-city':'city','need-payment':'payment'};
      if(map[e.target.id]){editNeeds({[map[e.target.id]]:e.target.value},'#'+e.target.id);return;}
      if(e.target.id==='demo-consent')$('confirm-demo').disabled=!e.target.checked;
    });
    $('surface').addEventListener('submit',e=>{
      if(e.target.id!=='applicant-form')return;e.preventDefault();saveForm(e.target);
      if(!state.applicant.name){$('form-error').textContent=tx('演示称呼不能仅为空格。','The demo name cannot be blank.');return;}
      if(!validSelection()){$('form-error').textContent=tx('报价已失效，请返回重新报价。','The quote has expired; go back and requote.');return;}
      followConversation=true;$('new-update').classList.add('hide');
      state.step=2;render();$('chat-status').textContent=tx('请核对演示订单和资料，阅读声明后确认。','Check the demo order and details, read the statement, then confirm.');
      focusSurface();$('surface').scrollIntoView({block:'start'});
    });
    $('surface').addEventListener('click',e=>{
      const button=e.target.closest('button');if(!button || button.disabled)return;
      followConversation=true;$('new-update').classList.add('hide');
      const action=button.dataset.action;
      if(['pause-flow','resume-flow','end-flow'].includes(action)){performAction(action);return;}
      if(state.flow!=='active' && action!=='restart')return;
      if(button.dataset.intent){updateNeeds({model:button.dataset.intent},false);$('surface').scrollIntoView({block:'start'});return;}
      if(button.dataset.city){editNeeds({city:button.dataset.city});applyNeedsDraft();return;}
      if(button.dataset.budget){applyFilter({budget:button.dataset.budget==='all'?null:Number(button.dataset.budget)});return;}
      if(button.dataset.confirm){delete state.inferred[button.dataset.confirm];render();$('chat-status').textContent=tx('已确认 AI 推断的条件。','AI-inferred condition confirmed.');return;}
      if(button.dataset.drop){applyFilter({[button.dataset.drop]:null});return;}
      if(button.dataset.battery){if(button.dataset.battery!==state.battery){quoteChange='battery';updateNeeds({battery:button.dataset.battery},false);requestQuote();}return;}
      if(button.dataset.payment){choosePayment(button.dataset.payment);return;}
      performAction(action,button.dataset.id);
    });
    function performAction(action,id){
      if(action==='pause-flow'){pauseFlow();return;}
      if(action==='resume-flow'){resumeFlow();return;}
      if(action==='end-flow'){requestEndFlow();return;}
      if(action==='restart'){reset();return;}
      if(state.flow!=='active' || state.confirmed){$('chat-status').textContent=tx('当前询价不可修改，请继续或开始新的询价。','This quote cannot be changed; resume it or start a new one.');return;}
      switch(action){
        case 'change-payment':changePayment();break;
        case 'quote':applyNeedsDraft();break;
        case 'cancel-needs':needsDraft=null;refreshNeedsEditor();$('needs-editor').querySelector('summary').focus({preventScroll:true});break;
        case 'select':selectPlan(id);break;
        case 'compare':$('compare-dialog').showModal();break;
        case 'clear-filters':applyFilter({budget:null,minRange:null,maxAccel:null});break;
        case 'back':if($('applicant-form'))saveForm($('applicant-form'));state.step=0;render();break;
        case 'edit':state.step=1;render();break;
        case 'confirm':if(state.step===2 && validSelection() && $('demo-consent')?.checked){state.confirmed=true;render();$('chat-status').textContent=tx('演示已完成，未支付定金或锁单。','Demo complete; no deposit paid, no order locked.');$('surface').scrollIntoView({block:'start'});}break;
        default:$('chat-status').textContent=tx('当前步骤已变化，请使用最新操作。','The step has changed; use the latest actions.');renderSessionMenu();
      }
    }
    // Stop auto-following new messages once the user scrolls back up; resume at the bottom.
    addEventListener('wheel',e=>{if(e.deltaY<0)followConversation=false;},{passive:true});
    let touchY=0;
    addEventListener('touchstart',e=>{touchY=e.touches[0].clientY;},{passive:true});
    addEventListener('touchmove',e=>{if(e.touches[0].clientY>touchY+5)followConversation=false;},{passive:true});
    addEventListener('keydown',e=>{if(!e.target.matches('input,select,textarea')&&['PageUp','Home','ArrowUp'].includes(e.key))followConversation=false;});
    addEventListener('scroll',()=>{if(document.documentElement.scrollHeight-scrollY-innerHeight<35){followConversation=true;$('new-update').classList.add('hide');}},{passive:true});
    $('new-update').addEventListener('click',()=>{followConversation=true;$('new-update').classList.add('hide');$('surface').scrollIntoView({block:'start'});focusSurface();});

    // ----- tour mode -----------------------------------------------------------------
    // The blog post's slide deck sends {tour:'step', id}; each step replays from a fresh
    // state so slides can be visited in any order. Highlights mark what the slide covers.
    if(TOUR){
      document.body.classList.add('tour');
      // Keep scrolling and focus inside the iframe so the host page never jumps.
      Element.prototype.scrollIntoView=function(){if(this.closest('dialog'))return;scrollBy(0,this.getBoundingClientRect().top-stickyTop()-14);};
      HTMLElement.prototype.focus=function(){};
    }
    const toCity=()=>updateNeeds({model:'su7'},false);
    const toPayment=()=>{toCity();editNeeds({city:'hz'});applyNeedsDraft();};
    const toOptions=()=>{toPayment();choosePayment('full');};
    const openNeeds=()=>{const d=$('surface').querySelector('.needs-summary');if(d)d.open=true;};
    const toForm=()=>{toOptions();selectPlan('su7-pro');};
    const toReview=()=>{toForm();$('applicant-form').requestSubmit();};
    const STEPS={
      start:{run:()=>{},hl:['.intent-grid','.compose']},
      ask:{run:toCity,hl:['.usage-options']},
      payment:{run:toPayment,hl:['.payment-choices']},
      sentence:{run:()=>handlePrompt(tx('预算 25 万以内，续航 600 公里以上，上海上牌，分期','Under ¥250k, at least 600 km range, plates in Shanghai, financing')),hl:['.message.user .bubble','.match-note','.plans']},
      infer:{run:()=>handlePrompt(tx('经常跑高速，二十来万，杭州上牌，全款','Lots of highway trips, around ¥200k, plates in Hangzhou, pay in full')),hl:['.cond.ai']},
      units:{run:()=>{toOptions();$('compare-dialog').showModal();},hl:['#compare-dialog .table-scroll','#compare-dialog .notice']},
      explain:{run:()=>{toOptions();handlePrompt(tx('小米 SU7 Pro 和比亚迪海豹 650 有什么区别？','Xiaomi SU7 Pro vs BYD Seal 650 — what is the difference?'));},hl:['.ai-explain .bubble','.ai-explain .mini-event']},
      staged:{run:()=>{toOptions();openNeeds();editNeeds({model:'seal'});},hl:['.edit-note','[data-quote-content]']},
      switch:{run:()=>{updateNeeds({model:'et5',city:'hz',payment:'full'},false);requestQuote();quoteChange='battery';updateNeeds({battery:'rent'},false);requestQuote();},hl:['[data-quote-content] > .notice','.history-card.stale']},
      form:{run:toForm,hl:['#applicant-form','.surface-label']},
      review:{run:toReview,hl:['.check','#confirm-demo']},
      summary:{run:()=>{toReview();$('demo-consent').checked=true;performAction('confirm');},hl:['.application-status']},
      mechanism:{run:()=>{handlePrompt(tx('经常跑高速，二十来万，杭州上牌，全款','Lots of highway trips, around ¥200k, plates in Hangzhou, pay in full'));openToolDialog('mechanism-dialog');},hl:['#trace']}
    };
    reset();
    if(TOUR){
      addEventListener('message',e=>{
        if(e.source!==parent || e.data?.tour!=='step')return;
        const step=STEPS[e.data.id];if(!step)return;
        reset();step.run();
        document.querySelectorAll('.hl').forEach(el=>el.classList.remove('hl'));
        step.hl.forEach(sel=>document.querySelectorAll(sel).forEach(el=>el.classList.add('hl')));
        const first=document.querySelector(step.hl[0]);
        if(first && $('messages').contains(first))requestAnimationFrame(()=>requestAnimationFrame(()=>first.scrollIntoView()));
      });
      parent.postMessage({tour:'ready'},'*');
    }
  </script>
</body>
</html>
