<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>合同填写 Agent（原型）</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<!--
  Contract fill agent (prototype). Fills official model contracts from the SAMR template library
  (https://htsfwb.samr.gov.cn/): 城镇房屋租赁合同 GF—2025—2614, 二手车买卖合同 GF-2015-0120,
  家庭居室装饰装修工程施工合同 GF-2000-0207.
    1. Extract (AI): the user describes the deal in plain words; values go to fields with the quote they came from.
       Not mentioned → blank and asked for; said differently later → both kept, the user picks.
    2. Fill (code): clause wording never changes; amounts in words, ratios and "/"/"无" are produced by code.
    3. Check (code): rules from each template's 使用说明 / 风险提示 and related regulations. Red blocks generation.
    4. Confirm (human).
  Files: style.css · js/engine.js (helpers + mock extraction) · js/templates/*.js (one per template) · js/app.js (UI).
  Extraction is mocked with regex rules; a real build calls an LLM for the same field JSON. No network calls.
-->
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="top">
  <div class="brand">合同填写 Agent<small>原型 · 模拟数据</small></div>
  <div class="tabs" id="tabs"></div>
  <span class="sp"></span>
  <a id="srclink" target="_blank" rel="noopener">合同示范文本库原文 ↗</a>
</div>
<div class="app">
  <aside class="left">
    <div class="lhead">合同助手<span><button id="replay">重播演示</button><button id="reset">清空</button></span></div>
    <div class="log" id="log"></div>
    <div class="composer">
      <div class="samples" id="samples"></div>
      <div class="atts" id="atts"></div>
      <div class="picker" id="picker" hidden></div>
      <textarea id="input" placeholder="发文件，或用平常的话说约定：谁和谁、多少钱、什么时候、出了问题怎么办……"></textarea>
      <div class="crow"><button class="clip" id="clip" title="添加文件">📎 文件</button><span class="hint">Ctrl ↵ 发送 · 原型模拟 AI</span><button class="gen" id="send">发送</button></div>
    </div>
  </aside>
  <main class="center">
    <div class="steps" id="steps"></div>
    <div class="docscroll" id="docscroll">
      <div class="docinner" id="docinner">
        <div class="legend"><span><i class="la"></i>AI 从你的描述整理</span><span><i class="lu"></i>你填写 / 修改</span><span><i class="lc"></i>代码生成</span><span><i class="lp"></i>待填写 / 勾选</span><span><i class="lx"></i>前后不一，待你选定</span></div>
        <div id="paper"></div>
        <div class="pop" id="pop" hidden></div>
      </div>
    </div>
    <div class="bar" id="bar"></div>
  </main>
  <aside class="side" id="side"></aside>
</div>
<div class="viewer" id="viewer" hidden></div>
<div class="toast" id="toast"></div>
<script src="js/engine.js"></script>
<script src="js/templates/lease.js"></script>
<script src="js/templates/car.js"></script>
<script src="js/templates/reno.js"></script>
<script src="js/app.js"></script>
</body>
</html>
