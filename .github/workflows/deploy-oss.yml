name: Deploy Hugo site to Aliyun OSS

# 可选方案：备案完成后手动触发，把站点同步到阿里云 OSS（配合 CDN）
# 需要 Variables: SITE_HOST / OSS_BUCKET / OSS_ENDPOINT
# 需要 Secrets:   OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-oss
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  HUGO_VERSION: 0.169.0
  OSSUTIL_VERSION: 1.7.19

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SITE_HOST: ${{ vars.SITE_HOST }}
      OSS_BUCKET: ${{ vars.OSS_BUCKET }}
      OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo (extended)
        run: |
          wget -qO "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --baseURL "https://${SITE_HOST}/"

      - name: Install ossutil
        run: |
          curl -sSL -o "${{ runner.temp }}/ossutil.zip" \
            "https://gosspublic.alicdn.com/ossutil/${OSSUTIL_VERSION}/ossutil-v${OSSUTIL_VERSION}-linux-amd64.zip"
          unzip -q "${{ runner.temp }}/ossutil.zip" -d "${{ runner.temp }}"
          echo "${{ runner.temp }}/ossutil-v${OSSUTIL_VERSION}-linux-amd64" >> "$GITHUB_PATH"

      - name: Configure ossutil
        run: |
          ossutil config -e "$OSS_ENDPOINT" -i "$OSS_ACCESS_KEY_ID" \
            -k "$OSS_ACCESS_KEY_SECRET" -L CH -c "$HOME/.ossutilconfig"

      # 资源文件缓存 1 天；CSS/JS 已由 Hugo 指纹化，需要更长缓存可在 CDN 侧配置
      - name: Upload assets
        run: |
          ossutil cp -r public/ "oss://${OSS_BUCKET}/" -u -f -j 20 \
            --exclude "*.html" \
            --meta "Cache-Control:public,max-age=86400"

      # HTML 缓存 5 分钟，发文章后很快生效，无需手动刷新 CDN
      - name: Upload HTML
        run: |
          ossutil cp -r public/ "oss://${OSS_BUCKET}/" -u -f -j 20 \
            --include "*.html" \
            --meta "Cache-Control:public,max-age=300"
