<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" role="img" aria-labelledby="title desc" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" fill="#1e293b">
  <title id="title">Proposed on-demand rereading pipeline</title>
  <desc id="desc">Classic OCR with shared extraction is the baseline. Handwriting, low-quality regions or high-risk fields trigger a VLM reread. Preserve candidates and sources separately. Agreement still requires validation; conflicts, failed rules or insufficient evidence go to human review.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L9 5 L0 9" fill="none" stroke="#64748b" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="758" height="608" rx="16" fill="#fff" stroke="#cbd5e1"/>
  <text x="380" y="38" text-anchor="middle" font-size="19" font-weight="600">Start with one baseline; add a second reading when needed</text>
  <text x="380" y="65" text-anchor="middle" font-size="14" fill="#92400e">Proposed design: full dual runs analyzed; on-demand routing still needs validation</text>
  <rect x="40" y="94" width="310" height="86" rx="10" fill="#f0fdfa" stroke="#0f766e"/>
  <text x="195" y="128" text-anchor="middle" font-size="17" font-weight="600" fill="#0f766e">Default: classic OCR</text>
  <text x="195" y="157" text-anchor="middle" font-size="14">Text, sources and available quality signals</text>
  <path d="M350 136 H405" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="410" y="94" width="310" height="86" rx="10" fill="#fffbeb" stroke="#b45309"/>
  <text x="565" y="128" text-anchor="middle" font-size="17" font-weight="600" fill="#b45309">Trigger a reread?</text>
  <text x="565" y="157" text-anchor="middle" font-size="14">Handwriting, low quality or high risk</text>
  <path d="M565 180 V212" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="579" y="202" font-size="13" fill="#92400e">Yes</text>
  <rect x="410" y="216" width="310" height="86" rx="10" fill="#fffbeb" stroke="#b45309"/>
  <text x="565" y="250" text-anchor="middle" font-size="17" font-weight="600" fill="#b45309">VLM rereads the source</text>
  <text x="565" y="279" text-anchor="middle" font-size="14">Keep both readings; do not overwrite</text>
  <path d="M195 180 V334" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="210" y="251" font-size="14" fill="#0f766e">Always keep baseline</text>
  <path d="M565 302 V334" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="338" width="680" height="78" rx="10" fill="#eef2ff" stroke="#4338ca"/>
  <text x="380" y="369" text-anchor="middle" font-size="17" font-weight="600" fill="#4338ca">Same extraction model and schema; separate field candidates</text>
  <text x="380" y="397" text-anchor="middle" font-size="14">Compare candidates when both exist; agreement does not prove correctness</text>
  <path d="M380 416 V444" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="170" y="448" width="420" height="48" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="380" y="478" text-anchor="middle" font-size="16" font-weight="600">Check evidence, conflicts and business rules</text>
  <path d="M270 496 V544" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M490 496 V544" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="255" y="526" text-anchor="end" font-size="13" fill="#0f766e">Acceptance rules met</text>
  <text x="505" y="526" font-size="13" fill="#b91c1c">Conflict, failure or weak evidence</text>
  <rect x="170" y="548" width="200" height="40" rx="8" fill="#f0fdfa" stroke="#0f766e"/>
  <text x="270" y="574" text-anchor="middle" font-size="16" fill="#0f766e">Accept result</text>
  <rect x="390" y="548" width="200" height="40" rx="8" fill="#fef2f2" stroke="#b91c1c"/>
  <text x="490" y="574" text-anchor="middle" font-size="16" fill="#b91c1c">Human review</text>
</svg>
