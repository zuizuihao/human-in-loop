<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','WenQuanYi Zen Hei',system-ui,sans-serif" font-size="13" fill="#334155">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1000" height="470" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- zone labels -->
  <rect x="150" y="40" width="380" height="400" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="168" y="64" font-size="12" fill="#64748b">Decide (read-only, mailbox untouched)</text>
  <rect x="670" y="40" width="300" height="400" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="688" y="64" font-size="12" fill="#64748b">Act (changes the mailbox)</text>

  <!-- mailbox -->
  <rect x="690" y="84" width="260" height="62" rx="8" fill="#fff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="820" y="110" text-anchor="middle" font-size="15" fill="#0f172a">Graph shared mailbox</text>
  <text x="820" y="131" text-anchor="middle" font-size="12" fill="#64748b">Folders + category tags = processing state</text>

  <!-- delta pull -->
  <path d="M690,115 H340 V196" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="515" y="107" text-anchor="middle" font-size="12" fill="#64748b">delta pull (new mail)</text>

  <!-- EventBridge -->
  <rect x="24" y="210" width="104" height="62" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="76" y="237" text-anchor="middle" font-size="14" fill="#0f172a">EventBridge</text>
  <text x="76" y="257" text-anchor="middle" font-size="12" fill="#64748b">schedule / sweep</text>
  <line x1="128" y1="241" x2="186" y2="241" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- ingest -->
  <rect x="190" y="200" width="300" height="82" rx="8" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/>
  <rect x="190" y="200" width="4" height="82" fill="#4f46e5"/>
  <text x="212" y="230" font-size="16" fill="#0f172a">ingest Lambda</text>
  <text x="212" y="252" font-size="12" fill="#64748b">Discover + decide · enqueue tasks</text>
  <text x="212" y="270" font-size="12" fill="#4f46e5">Routing ｜ Intent classification</text>

  <!-- dependencies -->
  <g text-anchor="middle">
    <line x1="240" y1="282" x2="240" y2="340" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3" marker-start="url(#a)" marker-end="url(#a)"/>
    <rect x="195" y="344" width="90" height="56" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="240" y="367" fill="#0f172a">Cursor store</text>
    <text x="240" y="386" font-size="12" fill="#64748b">delta token</text>
    <line x1="340" y1="282" x2="340" y2="340" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3" marker-start="url(#a)" marker-end="url(#a)"/>
    <rect x="295" y="344" width="90" height="56" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="340" y="367" fill="#0f172a">Business API</text>
    <text x="340" y="386" font-size="12" fill="#64748b">read-only</text>
    <line x1="440" y1="282" x2="440" y2="340" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3" marker-start="url(#a)" marker-end="url(#a)"/>
    <rect x="395" y="344" width="90" height="56" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="440" y="367" fill="#0f172a">LLM</text>
    <text x="440" y="386" font-size="12" fill="#64748b">categories</text>
  </g>

  <!-- ingest -> SQS -->
  <line x1="490" y1="241" x2="558" y2="241" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="524" y="232" text-anchor="middle" font-size="12" fill="#64748b">tasks</text>

  <!-- SQS -->
  <rect x="562" y="214" width="80" height="54" rx="8" fill="#fff" stroke="#d97706" stroke-width="1.5"/>
  <text x="602" y="246" text-anchor="middle" font-size="15" fill="#0f172a">SQS</text>

  <!-- DLQ -->
  <line x1="602" y1="268" x2="602" y2="340" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#a)"/>
  <text x="610" y="308" font-size="12" fill="#64748b">retries exhausted</text>
  <rect x="562" y="344" width="80" height="56" rx="8" fill="#fff" stroke="#e11d48" stroke-width="1.2"/>
  <text x="602" y="367" text-anchor="middle" fill="#0f172a">DLQ</text>
  <text x="602" y="386" text-anchor="middle" font-size="12" fill="#64748b">alert · manual</text>

  <!-- SQS -> worker -->
  <line x1="642" y1="241" x2="686" y2="241" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- worker -->
  <rect x="690" y="200" width="260" height="82" rx="8" fill="#fff" stroke="#059669" stroke-width="1.5"/>
  <rect x="690" y="200" width="4" height="82" fill="#059669"/>
  <text x="712" y="230" font-size="16" fill="#0f172a">worker Lambda</text>
  <text x="712" y="252" font-size="12" fill="#64748b">Mailbox actions · per-record retry</text>
  <text x="712" y="270" font-size="12" fill="#059669">Move ｜ Forward ｜ Tag</text>

  <!-- worker -> mailbox -->
  <line x1="820" y1="200" x2="820" y2="150" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="812" y="180" font-size="12" fill="#64748b" text-anchor="end">move / sendMail / category</text>

  <!-- note -->
  <text x="690" y="368" font-size="12" fill="#64748b">Idempotency uses mailbox state only:</text>
  <text x="690" y="388" font-size="12" fill="#64748b">folder location · "forwarded" tag</text>
  <text x="690" y="408" font-size="12" fill="#64748b">switches: DRY_RUN · KILL_SWITCH</text>
</svg>
