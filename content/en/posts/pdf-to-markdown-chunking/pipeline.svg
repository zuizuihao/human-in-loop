<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 716" role="img" aria-labelledby="title desc" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">
  <title id="title">PDF transcription and chunking pipeline</title>
  <desc id="desc">PDFs are split into batches of up to five pages and transcribed in parallel by a small model. A program checks every page; failed batches are redone whole by a stronger model. Each batch is checkpointed, then stitched by code and the heading tree is reviewed, giving Markdown with HTML tables and page markers. Finally it is chunked one heading per chunk and indexed.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#64748b" stroke-width="1.6"/></marker></defs>
  <rect x="1" y="1" width="758" height="714" rx="16" fill="#fff" stroke="#e2e8f0"/>
<text x="40" y="36" text-anchor="start" font-size="14" fill="#b45309">PDF to Markdown: get the structure right</text>
<rect x="40" y="56" width="480" height="58" rx="10" fill="#fff" stroke="#b45309" stroke-width="1.4"/>
<text x="280.0" y="79.0" text-anchor="middle" font-size="15" font-weight="600" fill="#b45309">Split into batches</text>
<text x="280.0" y="101.0" text-anchor="middle" font-size="13.5" fill="#475569">Up to 5 pages each, independent, no context pages</text>
<path d="M280 114 L280 134" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="134" width="480" height="58" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="280.0" y="157.0" text-anchor="middle" font-size="15" font-weight="600" fill="#b45309">Small-model transcription</text>
<text x="280.0" y="179.0" text-anchor="middle" font-size="13.5" fill="#475569">Parallel, thinking on, HTML tables, page and language markers</text>
<path d="M280 192 L280 212" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="212" width="480" height="58" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="280.0" y="235.0" text-anchor="middle" font-size="15" font-weight="600" fill="#b45309">Per-page checks (no model)</text>
<text x="280.0" y="257.0" text-anchor="middle" font-size="13.5" fill="#475569">Against OCR text: coverage, placeholders, notes, rows packed in a cell</text>
<rect x="566" y="212" width="164" height="58" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
<text x="648.0" y="235.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#be123c">Stronger model</text>
<text x="648.0" y="257.0" text-anchor="middle" font-size="12.0" fill="#475569">redoes the batch once</text>
<path d="M520 241.0 L564 241.0" fill="none" stroke="#be123c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="543" y="234.0" text-anchor="middle" font-size="11" fill="#be123c">fails</text>
<path d="M648 270 V319.0 H522" fill="none" stroke="#be123c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<path d="M280 270 L280 290" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="290" width="480" height="58" rx="10" fill="#fff" stroke="#b45309" stroke-width="1.4"/>
<text x="280.0" y="313.0" text-anchor="middle" font-size="15" font-weight="600" fill="#b45309">Checkpoint</text>
<text x="280.0" y="335.0" text-anchor="middle" font-size="13.5" fill="#475569">Keyed by PDF hash, pages, model and prompt version</text>
<path d="M280 348 L280 368" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="368" width="480" height="58" rx="10" fill="#fff" stroke="#b45309" stroke-width="1.4"/>
<text x="280.0" y="391.0" text-anchor="middle" font-size="15" font-weight="600" fill="#b45309">Stitch by code</text>
<text x="280.0" y="413.0" text-anchor="middle" font-size="13.5" fill="#475569">Join split tables · drop repeated headers · align heading levels</text>
<path d="M280 426 L280 446" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="446" width="480" height="58" rx="10" fill="#fff" stroke="#b45309" stroke-width="1.4"/>
<text x="280.0" y="469.0" text-anchor="middle" font-size="15" font-weight="600" fill="#b45309">Heading-tree review</text>
<text x="280.0" y="491.0" text-anchor="middle" font-size="13.5" fill="#475569">Code checks first; only then send the heading list, get edit ops</text>
<path d="M280 504 L280 550" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="40" y="544" text-anchor="start" font-size="14" fill="#0f766e">Chunking: follow the headings</text>
<rect x="40" y="550" width="480" height="58" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/>
<text x="280.0" y="573.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0f766e">One heading, one chunk</text>
<text x="280.0" y="595.0" text-anchor="middle" font-size="13.5" fill="#475569">Split above 2,048 tokens, merge below 50, tables by row with header</text>
<path d="M280 608 L280 628" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="628" width="480" height="58" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.4"/>
<text x="280.0" y="651.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0f766e">Index</text>
<text x="280.0" y="673.0" text-anchor="middle" font-size="13.5" fill="#475569">Title + heading path + body → vector; keyword fields; rerank</text>
</svg>
