    <rect x="408" y="190" width="130" height="64" rx="10" fill="#fff" stroke="#64748b"/>
    <text x="473" y="218" font-weight="600">Shots</text><text x="473" y="239" font-size="12" fill="#64748b">Shot list + storyboard</text>
    <rect x="598" y="190" width="134" height="64" rx="10" fill="#fff" stroke="#64748b"/>
    <text x="665" y="218" font-weight="600">Video</text><text x="665" y="239" font-size="12" fill="#64748b">Sample → final</text>
  </g>
  <g stroke="#64748b" stroke-width="1.5" marker-end="url(#a)">
