<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 630" role="img" aria-labelledby="title desc" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">
  <title id="title">Overall structure of the knowledge base</title>
  <desc id="desc">Website pages, PDF originals and manual material pass through source adapters and arrive as pull requests in a Git-managed Markdown knowledge base; originals are stored by hash outside the repository. After merge, an exact-fetch API and a search index serve the chatbot and the search page.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#64748b" stroke-width="1.6"/></marker></defs>
  <rect x="1" y="1" width="758" height="628" rx="16" fill="#fff" stroke="#e2e8f0"/>
<rect x="40" y="28" width="200" height="46" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
<text x="140.0" y="56.0" text-anchor="middle" font-size="15" font-weight="600">Website pages</text>
<path d="M140 74 V93.0 H260 V112" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="280" y="28" width="200" height="46" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
<text x="380.0" y="56.0" text-anchor="middle" font-size="15" font-weight="600">PDF originals</text>
<path d="M380 74 V93.0 H260 V112" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="520" y="28" width="200" height="46" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
<text x="620.0" y="56.0" text-anchor="middle" font-size="15" font-weight="600">Manual material</text>
<path d="M620 74 V93.0 H260 V112" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="112" width="440" height="62" rx="10" fill="#fff" stroke="#4338ca" stroke-width="1.4"/>
<text x="260.0" y="137.0" text-anchor="middle" font-size="15" font-weight="600" fill="#4338ca">Source adapters</text>
<text x="260.0" y="159.0" text-anchor="middle" font-size="13.5" fill="#475569">Fetch · convert to Markdown · split by language</text>
<rect x="520" y="112" width="200" height="62" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
<text x="620.0" y="137.0" text-anchor="middle" font-size="14" font-weight="600">Original store</text>
<text x="620.0" y="159.0" text-anchor="middle" font-size="12.5" fill="#475569">By sha256, append-only</text>
<path d="M480 143 L518 143" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<path d="M260 174 L260 214" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M620 174 L620 214" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="628" y="200" text-anchor="start" font-size="12" fill="#64748b">original hash</text>
<rect x="40" y="214" width="680" height="96" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="1.4"/>
<text x="380.0" y="245.0" text-anchor="middle" font-size="17" font-weight="600" fill="#4338ca">Git knowledge base</text>
<text x="380.0" y="267.0" text-anchor="middle" font-size="15.5" fill="#475569">Markdown bodies · Q&amp;A · YAML metadata</text>
<text x="380.0" y="289.0" text-anchor="middle" font-size="15.5" fill="#475569">Each body records its original's hash and pages</text>
<text x="380" y="340" text-anchor="middle" font-size="14" fill="#4338ca">Branch + PR → review the diff → merge to publish</text>
<path d="M200 310 L200 450" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 310 L560 450" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="450" width="320" height="86" rx="10" fill="#fff" stroke="#4338ca" stroke-width="1.4"/>
<text x="200.0" y="476.0" text-anchor="middle" font-size="15" font-weight="600" fill="#4338ca">Exact-fetch API</text>
<text x="200.0" y="498.0" text-anchor="middle" font-size="13.5" fill="#475569">Whole documents by type, language, version</text>
<text x="200.0" y="520.0" text-anchor="middle" font-size="13.5" fill="#475569">Loads the repo into an in-memory index</text>
<rect x="400" y="450" width="320" height="86" rx="10" fill="#fff" stroke="#4338ca" stroke-width="1.4"/>
<text x="560.0" y="476.0" text-anchor="middle" font-size="15" font-weight="600" fill="#4338ca">Search index</text>
<text x="560.0" y="498.0" text-anchor="middle" font-size="13.5" fill="#475569">Chunks + heading path + page</text>
<text x="560.0" y="520.0" text-anchor="middle" font-size="13.5" fill="#475569">Keyword + vector → RRF → rerank</text>
<path d="M200 536 L200 566" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 536 L560 566" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="110" y="566" width="180" height="40" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
<text x="200.0" y="591.0" text-anchor="middle" font-size="14" font-weight="600">Chatbot</text>
<rect x="470" y="566" width="180" height="40" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
<text x="560.0" y="591.0" text-anchor="middle" font-size="14" font-weight="600">Search page</text>
</svg>
