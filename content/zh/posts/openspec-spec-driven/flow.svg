<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Noto Sans CJK SC, PingFang SC, system-ui, sans-serif" font-size="14" fill="#1f2328">
  <rect width="760" height="470" fill="#ffffff"/>
  <!-- steps -->
  <g font-size="15" font-weight="600" text-anchor="middle">
    <rect x="20" y="20" width="160" height="46" rx="8" fill="#fff" stroke="#8c959f"/><text x="100" y="49">explore 讨论</text>
    <rect x="207" y="20" width="160" height="46" rx="8" fill="#fff" stroke="#0969da"/><text x="287" y="49" fill="#0969da">propose 写提案</text>
    <rect x="394" y="20" width="160" height="46" rx="8" fill="#fff" stroke="#9a6700"/><text x="474" y="49" fill="#9a6700">apply 实现</text>
    <rect x="581" y="20" width="160" height="46" rx="8" fill="#fff" stroke="#1a7f37"/><text x="661" y="49" fill="#1a7f37">archive 归档</text>
  </g>
  <g stroke="#8c959f" stroke-width="1.5" fill="none">
    <path d="M180 43 H203"/><path d="M198 38 L204 43 L198 48"/>
    <path d="M367 43 H390"/><path d="M385 38 L391 43 L385 48"/>
    <path d="M554 43 H577"/><path d="M572 38 L578 43 L572 48"/>
  </g>
  <g font-size="12.5" fill="#57606a" text-anchor="middle">
    <text x="100" y="88">读代码，比较方案</text><text x="100" y="106">不产生文件</text>
    <text x="287" y="88">人审阅提案和增量规格</text><text x="287" y="106">再动代码</text>
    <text x="474" y="88">按 tasks 逐条实现、测试</text><text x="474" y="106">发现问题回头改文档</text>
    <text x="661" y="88">增量合并进 specs/</text><text x="661" y="106">变更移入 archive/</text>
  </g>
  <!-- changes folder -->
  <rect x="20" y="140" width="400" height="300" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="40" y="170" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="600" fill="#0969da">changes/filter-current-versions/</text>
  <g font-size="13.5">
    <rect x="40" y="186" width="360" height="52" rx="6" fill="#fff" stroke="#d0d7de"/>
    <text x="56" y="208" font-family="DejaVu Sans Mono, monospace">proposal.md</text><text x="56" y="228" fill="#57606a" font-size="12.5">为什么做、改什么、不做什么、影响范围</text>
    <rect x="40" y="246" width="360" height="52" rx="6" fill="#fff" stroke="#1a7f37"/>
    <text x="56" y="268" font-family="DejaVu Sans Mono, monospace" fill="#1a7f37">specs/search/spec.md</text><text x="56" y="288" fill="#57606a" font-size="12.5">增量：ADDED / MODIFIED / REMOVED 的需求和场景</text>
    <rect x="40" y="306" width="360" height="52" rx="6" fill="#fff" stroke="#d0d7de"/>
    <text x="56" y="328" font-family="DejaVu Sans Mono, monospace">design.md</text><text x="56" y="348" fill="#57606a" font-size="12.5">技术决策、备选方案、风险、迁移步骤</text>
    <rect x="40" y="366" width="360" height="52" rx="6" fill="#fff" stroke="#d0d7de"/>
    <text x="56" y="388" font-family="DejaVu Sans Mono, monospace">tasks.md</text><text x="56" y="408" fill="#57606a" font-size="12.5">带编号的勾选清单，含测试和验证</text>
  </g>
  <!-- merge arrow -->
  <g stroke="#1a7f37" stroke-width="1.5" fill="none"><path d="M400 272 H520"/><path d="M514 266 L521 272 L514 278"/></g>
  <text x="460" y="262" text-anchor="middle" font-size="12.5" fill="#1a7f37">归档时合并</text>
  <!-- specs -->
  <rect x="525" y="140" width="215" height="300" rx="10" fill="#fff" stroke="#1a7f37"/>
  <text x="545" y="170" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="600" fill="#1a7f37">specs/</text>
  <g font-family="DejaVu Sans Mono, monospace" font-size="13.5">
    <text x="560" y="206">catalog/spec.md</text><text x="560" y="234">ingest/spec.md</text><text x="560" y="262">retrieve/spec.md</text><text x="560" y="290">search/spec.md</text>
  </g>
  <g font-size="12.5" fill="#57606a"><text x="545" y="336">系统现在的行为</text><text x="545" y="356">按能力分文件</text><text x="545" y="376">只描述外部可见的行为</text><text x="545" y="396">下一次变更从这里读起</text></g>
</svg>
