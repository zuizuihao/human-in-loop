<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','WenQuanYi Zen Hei',system-ui,sans-serif" font-size="13" fill="#19392f">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#8a958c" stroke-width="1.6"/></marker>
  <marker id="u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#4d7c8a" stroke-width="1.6"/></marker></defs>
  <rect width="1000" height="380" rx="16" fill="#fbfbf7" stroke="#e1e6de"/><rect x="30" y="72" width="160" height="60" rx="30" fill="#fff" stroke="#a9b3ab" stroke-width="1.5" /><text x="110" y="99" text-anchor="middle" font-size="15" fill="#19392f">未报价</text><text x="110" y="117" text-anchor="middle" font-size="11" fill="#758079">needs-quote</text><rect x="290" y="72" width="160" height="60" rx="30" fill="#fff" stroke="#4d7c8a" stroke-width="1.5" /><text x="370" y="99" text-anchor="middle" font-size="15" fill="#19392f">报价中</text><text x="370" y="117" text-anchor="middle" font-size="11" fill="#758079">等待报价服务</text><rect x="550" y="72" width="160" height="60" rx="30" fill="#fff" stroke="#25634e" stroke-width="1.5" /><text x="630" y="99" text-anchor="middle" font-size="15" fill="#19392f">可选择</text><text x="630" y="117" text-anchor="middle" font-size="11" fill="#758079">与当前需求一致</text><rect x="810" y="72" width="160" height="60" rx="30" fill="#edf3e6" stroke="#25634e" stroke-width="1.5" /><text x="890" y="99" text-anchor="middle" font-size="15" fill="#19392f">已选择</text><text x="890" y="117" text-anchor="middle" font-size="11" fill="#758079">进入草稿</text><rect x="550" y="232" width="160" height="60" rx="30" fill="#fff" stroke="#6b7f3a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="630" y="259" text-anchor="middle" font-size="15" fill="#19392f">待更新</text><text x="630" y="277" text-anchor="middle" font-size="11" fill="#758079">旧报价锁定</text><path d="M190,102 H286" fill="none" stroke="#8a958c" stroke-width="1.5" marker-end="url(#a)"/><text x="238" y="92" text-anchor="middle" font-size="12" fill="#758079">请求报价</text><path d="M450,102 H546" fill="none" stroke="#8a958c" stroke-width="1.5" marker-end="url(#a)"/><text x="498" y="92" text-anchor="middle" font-size="12" fill="#758079">价格返回</text><path d="M710,102 H806" fill="none" stroke="#8a958c" stroke-width="1.5" marker-end="url(#a)"/><text x="758" y="92" text-anchor="middle" font-size="12" fill="#758079">用户选择</text><path d="M610,132 V228" fill="none" stroke="#8a958c" stroke-width="1.5" marker-end="url(#a)"/><text x="602" y="185" text-anchor="end" font-size="12" fill="#758079">修改需求</text><path d="M650,228 V136" fill="none" stroke="#8a958c" stroke-width="1.5" marker-end="url(#a)"/><text x="658" y="185" text-anchor="start" font-size="12" fill="#758079">取消</text><path d="M556,244 L452,128" fill="none" stroke="#6b7f3a" stroke-width="1.5" marker-end="url(#a)"/><text x="505" y="230" text-anchor="end" font-size="12" fill="#6b7f3a">确认更新</text><text x="500" y="346" text-anchor="middle" font-size="12" fill="#758079">改车型、城市、付款方式或电池方案，旧报价和旧卡片就失效；迟到的报价结果不会覆盖新的选择。</text>
