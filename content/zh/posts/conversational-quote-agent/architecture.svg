<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','WenQuanYi Zen Hei',system-ui,sans-serif" font-size="13" fill="#19392f">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#8a958c" stroke-width="1.6"/></marker>
  <marker id="u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#4d7c8a" stroke-width="1.6"/></marker></defs>
  <rect width="1000" height="600" rx="16" fill="#fbfbf7" stroke="#e1e6de"/><rect x="280" y="96" width="190" height="112" rx="12" fill="#fbf3e6"/><text x="375" y="228" text-anchor="middle" font-size="12" fill="#9a651d">模型只参与这一段</text><line x1="130" y1="78" x2="130" y2="566" stroke="#e1e6de" stroke-width="1.5" stroke-dasharray="3 5"/><rect x="38" y="34" width="184" height="40" rx="20" fill="#fff" stroke="#4d7c8a" stroke-width="1.5"/><text x="130" y="59" text-anchor="middle" font-size="14" fill="#4d7c8a">用户</text><line x1="375" y1="78" x2="375" y2="566" stroke="#e1e6de" stroke-width="1.5" stroke-dasharray="3 5"/><rect x="283" y="34" width="184" height="40" rx="20" fill="#fff" stroke="#9a651d" stroke-width="1.5"/><text x="375" y="59" text-anchor="middle" font-size="14" fill="#9a651d">Agent · 理解意图</text><line x1="625" y1="78" x2="625" y2="566" stroke="#e1e6de" stroke-width="1.5" stroke-dasharray="3 5"/><rect x="533" y="34" width="184" height="40" rx="20" fill="#fff" stroke="#25634e" stroke-width="1.5"/><text x="625" y="59" text-anchor="middle" font-size="14" fill="#25634e">编排层 · 状态机</text><line x1="870" y1="78" x2="870" y2="566" stroke="#e1e6de" stroke-width="1.5" stroke-dasharray="3 5"/><rect x="778" y="34" width="184" height="40" rx="20" fill="#fff" stroke="#6b7f3a" stroke-width="1.5"/><text x="870" y="59" text-anchor="middle" font-size="14" fill="#6b7f3a">卡片 · 组件目录</text><line x1="136" y1="128" x2="367" y2="128" stroke="#8a958c" stroke-width="1.5"  marker-end="url(#a)"/><text x="252.5" y="119" text-anchor="middle" font-size="12" fill="#758079">“预算 25 万，续航 600 以上，上海上牌”</text><line x1="381" y1="190" x2="617" y2="190" stroke="#8a958c" stroke-width="1.5"  marker-end="url(#a)"/><text x="500" y="165" text-anchor="middle" font-size="12" fill="#758079">结构化需求</text><text x="500" y="181" text-anchor="middle" font-size="12" fill="#758079">不限车型 · 上海 · ≤ 25 万 · ≥ 600 km</text><rect x="510" y="246" width="230" height="34" rx="17" fill="#edf3e6" stroke="#25634e"/><text x="625" y="268" text-anchor="middle" font-size="12" fill="#25634e">校验 → 报价 / 金融试算服务</text><line x1="631" y1="330" x2="862" y2="330" stroke="#8a958c" stroke-width="1.5"  marker-end="url(#a)"/><text x="747.5" y="321" text-anchor="middle" font-size="12" fill="#758079">界面描述：用哪些组件、允许哪些操作</text><line x1="864" y1="388" x2="138" y2="388" stroke="#8a958c" stroke-width="1.5"  marker-end="url(#a)"/><text x="500" y="379" text-anchor="middle" font-size="12" fill="#758079">渲染版本卡（指导价 · 落地价 · 月供）</text><line x1="136" y1="446" x2="617" y2="446" stroke="#4d7c8a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#u)"/><text x="377.5" y="437" text-anchor="middle" font-size="12" fill="#4d7c8a">点击「选这个」· 不经过模型</text><line x1="631" y1="504" x2="862" y2="504" stroke="#8a958c" stroke-width="1.5"  marker-end="url(#a)"/><text x="747.5" y="495" text-anchor="middle" font-size="12" fill="#758079">资料卡：受控表单，不发送给模型</text><line x1="864" y1="556" x2="138" y2="556" stroke="#8a958c" stroke-width="1.5"  marker-end="url(#a)"/><text x="500" y="547" text-anchor="middle" font-size="12" fill="#758079">复核 → 用户确认（不代付定金）</text>
</svg>
