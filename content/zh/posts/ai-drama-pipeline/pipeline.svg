<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="760" height="420" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0d9488"/></marker>
  </defs>

  <!-- series layer -->
  <rect x="10" y="12" width="740" height="104" rx="12" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="28" y="40" font-size="15" font-weight="600" fill="#5b21b6">系列层 · 做一次，跨集共用</text>
  <g font-size="14" fill="#334155" text-anchor="middle">
    <rect x="28" y="54" width="200" height="46" rx="8" fill="#fff" stroke="#c4b5fd"/>
    <text x="128" y="82">世界观 · 角色小传</text>
    <rect x="280" y="54" width="200" height="46" rx="8" fill="#fff" stroke="#c4b5fd"/>
    <text x="380" y="82">大纲</text>
    <rect x="532" y="54" width="200" height="46" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="632" y="76">资产库</text>
    <text x="632" y="93" font-size="12" fill="#64748b">设定卡 · 连续性锁 · 参考图</text>
  </g>

  <!-- episode layer -->
  <rect x="10" y="140" width="740" height="140" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="28" y="168" font-size="15" font-weight="600" fill="#334155">单集层 · 每集一份，所有类型都走这四步</text>

  <g font-size="15" text-anchor="middle" fill="#0f172a">
    <rect x="28" y="190" width="130" height="64" rx="10" fill="#fff" stroke="#64748b"/>
    <text x="93" y="218" font-weight="600">剧本</text><text x="93" y="239" font-size="12" fill="#64748b">按段拆，台词只在这里</text>
    <rect x="218" y="190" width="130" height="64" rx="10" fill="#fff" stroke="#64748b"/>
    <text x="283" y="218" font-weight="600">资产</text><text x="283" y="239" font-size="12" fill="#64748b">本集新出现的建卡</text>
    <rect x="408" y="190" width="130" height="64" rx="10" fill="#fff" stroke="#64748b"/>
    <text x="473" y="218" font-weight="600">分镜</text><text x="473" y="239" font-size="12" fill="#64748b">镜头表 + 故事板</text>
    <rect x="598" y="190" width="134" height="64" rx="10" fill="#fff" stroke="#64748b"/>
    <text x="665" y="218" font-weight="600">视频</text><text x="665" y="239" font-size="12" fill="#64748b">样片 → 正片 → 拼接</text>
  </g>
  <g stroke="#64748b" stroke-width="1.5" marker-end="url(#a)">
    <line x1="158" y1="222" x2="216" y2="222"/>
    <line x1="348" y1="222" x2="406" y2="222"/>
    <line x1="538" y1="222" x2="596" y2="222"/>
  </g>

  <!-- library links -->
  <g stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="4 4" fill="none" marker-end="url(#d)">
    <path d="M600 100 C 520 150, 330 150, 300 188"/>
    <path d="M640 100 C 620 150, 520 160, 490 188"/>
  </g>
  <text x="210" y="134" font-size="12" fill="#7c3aed" text-anchor="middle">建卡入库 · 分镜从库里选用</text>

  <!-- type skill layer -->
  <rect x="10" y="304" width="740" height="104" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="28" y="332" font-size="15" font-weight="600" fill="#0f766e">类型 Skill · 选一份，叠加到每个子 Agent 上</text>
  <g font-size="13" fill="#134e4a" text-anchor="middle">
    <rect x="28" y="348" width="108" height="40" rx="8" fill="#fff" stroke="#0d9488" stroke-width="1.5"/><text x="82" y="373">AI 漫剧</text>
    <rect x="148" y="348" width="108" height="40" rx="8" fill="#fff" stroke="#99f6e4"/><text x="202" y="373">付费短剧</text>
    <rect x="268" y="348" width="108" height="40" rx="8" fill="#fff" stroke="#99f6e4"/><text x="322" y="373">搞笑 / 萌宠</text>
    <rect x="388" y="348" width="108" height="40" rx="8" fill="#fff" stroke="#99f6e4"/><text x="442" y="373">小说推文</text>
    <rect x="508" y="348" width="108" height="40" rx="8" fill="#fff" stroke="#99f6e4"/><text x="562" y="373">电商广告</text>
    <rect x="628" y="348" width="104" height="40" rx="8" fill="#fff" stroke="#99f6e4"/><text x="680" y="373">知识科普</text>
  </g>
  <text x="740" y="332" font-size="12" fill="#0f766e" text-anchor="end">节拍 · 资产表 · 子 Agent 检查清单</text>
  <g stroke="#0d9488" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#s)">
    <line x1="93" y1="304" x2="93" y2="256"/>
    <line x1="283" y1="304" x2="283" y2="256"/>
    <line x1="473" y1="304" x2="473" y2="256"/>
    <line x1="665" y1="304" x2="665" y2="256"/>
  </g>
</svg>
