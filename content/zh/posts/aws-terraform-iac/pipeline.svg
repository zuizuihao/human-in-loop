<circle cx="48" cy="120" r="12" fill="none" stroke="#0f766e" stroke-width="1.3"/><text x="48" y="124.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f766e">2</text>
<text x="74" y="125" font-size="14.5" font-weight="600">计划</text>
<text x="226" y="125" font-size="13" fill="#334155">只算受影响的“层 × 环境”，摘要贴回 PR · 只读角色</text>
<line x1="48" y1="148" x2="48" y2="164" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="20" y="164" width="720" height="56" rx="10" fill="#fff" stroke="#1e293b" stroke-width="1.3"/>
<circle cx="48" cy="192" r="12" fill="none" stroke="#1e293b" stroke-width="1.3"/><text x="48" y="196.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">3</text>
<text x="74" y="197" font-size="14.5" font-weight="600">审阅 · 合并</text>
<text x="226" y="197" font-size="13" fill="#334155">审的是计划：新建、修改、销毁各有多少</text>
<line x1="48" y1="220" x2="48" y2="236" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="20" y="236" width="720" height="56" rx="10" fill="#fff" stroke="#4338ca" stroke-width="1.3"/>
<circle cx="48" cy="264" r="12" fill="none" stroke="#4338ca" stroke-width="1.3"/><text x="48" y="268.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4338ca">4</text>
<text x="74" y="269" font-size="14.5" font-weight="600">非生产执行</text>
<text x="226" y="269" font-size="13" fill="#334155">开发 → 测试 → 预发布 · 执行保存的计划，不重新计划</text>
<line x1="48" y1="292" x2="48" y2="308" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="20" y="308" width="720" height="56" rx="10" fill="#fff" stroke="#b45309" stroke-width="1.3"/>
<circle cx="48" cy="336" r="12" fill="none" stroke="#b45309" stroke-width="1.3"/><text x="48" y="340.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b45309">5</text>
<text x="74" y="341" font-size="14.5" font-weight="600">生产执行</text>
<text x="226" y="341" font-size="13" fill="#334155">生产 · 灾备 · 在 Environment 上审批后执行</text>
<rect x="20" y="376" width="720" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="380" y="401" text-anchor="middle" font-size="12.5" fill="#64748b">执行角色按环境区分 · OIDC 临时凭证 · 只信任本仓库 + 本 Environment</text>
<rect x="20" y="428" width="720" height="40" rx="8" fill="#fff" stroke="#cbd5e1" stroke-dasharray="5 4"/><text x="380" y="453" text-anchor="middle" font-size="12.5">每晚漂移检测：对所有环境跑一次计划，有差异就告警</text>
