<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 504" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif" font-size="13" fill="#1e293b">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#94a3b8" stroke-width="1.6"/></marker></defs>
<rect width="760" height="504" rx="16" fill="#fff" stroke="#e2e8f0"/>
<rect x="20" y="20" width="720" height="56" rx="10" fill="#fff" stroke="#64748b" stroke-width="1.3"/>
<circle cx="48" cy="48" r="12" fill="none" stroke="#64748b" stroke-width="1.3"/><text x="48" y="52.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#64748b">1</text>
<text x="74" y="53" font-size="14.5" font-weight="600">Pull Request</text>
<text x="226" y="53" font-size="13" fill="#334155">格式 · 语法 · 静态检查 · 安全扫描</text>
