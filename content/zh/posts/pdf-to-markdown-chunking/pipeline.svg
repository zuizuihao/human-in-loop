<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 716" role="img" aria-labelledby="title desc" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" fill="#1e293b">
  <title id="title">PDF 转写与切块的流水线</title>
  <desc id="desc">PDF 按每批 5 页拆分，由小模型并发转写；程序逐页校验，不通过的批整批交给强模型重转；每批存检查点，由程序拼接并复核标题树，得到带 HTML 表格和页码标记的 Markdown，最后一个标题一个片段地切块并建索引。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#64748b" stroke-width="1.6"/></marker></defs>
  <rect x="1" y="1" width="758" height="714" rx="16" fill="#fff" stroke="#e2e8f0"/>
<text x="40" y="36" text-anchor="start" font-size="14" fill="#b45309">PDF 转 Markdown：把结构写对</text>
<rect x="40" y="56" width="480" height="58" rx="10" fill="#fff" stroke="#b45309" stroke-width="1.4"/>
<text x="280.0" y="79.0" text-anchor="middle" font-size="15" font-weight="600" fill="#b45309">拆批</text>
<text x="280.0" y="101.0" text-anchor="middle" font-size="13.5" fill="#475569">每批最多 5 页，各批独立，不带上下文页</text>
<path d="M280 114 L280 134" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="134" width="480" height="58" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="280.0" y="157.0" text-anchor="middle" font-size="15" font-weight="600" fill="#b45309">小模型转写</text>
<text x="280.0" y="179.0" text-anchor="middle" font-size="13.5" fill="#475569">并发，开启思考，HTML 表格，页码与语言标记</text>
<path d="M280 192 L280 212" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="212" width="480" height="58" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="280.0" y="235.0" text-anchor="middle" font-size="15" font-weight="600" fill="#b45309">逐页校验（不调模型）</text>
<text x="280.0" y="257.0" text-anchor="middle" font-size="13.5" fill="#475569">以 OCR 文字为参考：完整度、占位、说明文字、多行压进一格</text>
<rect x="566" y="212" width="164" height="58" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
<text x="648.0" y="235.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#be123c">强模型整批重转</text>
<text x="648.0" y="257.0" text-anchor="middle" font-size="12.0" fill="#475569">只试一次，从不拆批</text>
<path d="M520 241.0 L564 241.0" fill="none" stroke="#be123c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="543" y="234.0" text-anchor="middle" font-size="11" fill="#be123c">不通过</text>
<path d="M648 270 V319.0 H522" fill="none" stroke="#be123c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<path d="M280 270 L280 290" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="290" width="480" height="58" rx="10" fill="#fff" stroke="#b45309" stroke-width="1.4"/>
<text x="280.0" y="313.0" text-anchor="middle" font-size="15" font-weight="600" fill="#b45309">检查点</text>
<text x="280.0" y="335.0" text-anchor="middle" font-size="13.5" fill="#475569">按 PDF 哈希、页码、模型、提示词版本存盘</text>
<path d="M280 348 L280 368" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="368" width="480" height="58" rx="10" fill="#fff" stroke="#b45309" stroke-width="1.4"/>
<text x="280.0" y="391.0" text-anchor="middle" font-size="15" font-weight="600" fill="#b45309">程序拼接</text>
<text x="280.0" y="413.0" text-anchor="middle" font-size="13.5" fill="#475569">接跨批表格 · 去重复页眉页脚 · 按编号对齐标题层级</text>
<path d="M280 426 L280 446" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="446" width="480" height="58" rx="10" fill="#fff" stroke="#b45309" stroke-width="1.4"/>
<text x="280.0" y="469.0" text-anchor="middle" font-size="15" font-weight="600" fill="#b45309">标题树复核</text>
<text x="280.0" y="491.0" text-anchor="middle" font-size="13.5" fill="#475569">程序检查；有问题才把标题列表发给模型，只回修改指令</text>
<path d="M280 504 L280 550" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="40" y="544" text-anchor="start" font-size="14" fill="#0f766e">切块：只按标题走</text>
<rect x="40" y="550" width="480" height="58" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/>
<text x="280.0" y="573.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0f766e">一个标题一个片段</text>
<text x="280.0" y="595.0" text-anchor="middle" font-size="13.5" fill="#475569">超过 2,048 tokens 才拆，不到 50 合并，表格按行拆并重复表头</text>
<path d="M280 608 L280 628" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="628" width="480" height="58" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.4"/>
<text x="280.0" y="651.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0f766e">索引</text>
<text x="280.0" y="673.0" text-anchor="middle" font-size="13.5" fill="#475569">标题 + 标题路径 + 正文 → 向量；关键词字段；重排</text>
</svg>
