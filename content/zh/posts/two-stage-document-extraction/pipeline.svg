<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-labelledby="title desc" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" fill="#1e293b">
  <title id="title">两阶段抽取与独立校验</title>
  <desc id="desc">扫描件先转写为关联原件的文本，再抽取为带来源的字段候选。跨页合并、规则校验和人工复核独立执行，缓存绑定输入与配置版本。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L9 5 L0 9" fill="none" stroke="#64748b" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="758" height="598" rx="16" fill="#fff" stroke="#cbd5e1"/>
  <rect x="180" y="24" width="400" height="48" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="380" y="54" text-anchor="middle" font-size="17" font-weight="600">扫描件与原件版本</text>
  <path d="M380 72 V100" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="100" width="680" height="112" rx="10" fill="#f0fdfa" stroke="#0f766e"/>
  <text x="64" y="130" font-size="18" font-weight="600" fill="#0f766e">阶段 1 · 转写：忠于原件，不替原文纠错</text>
  <text x="64" y="160" font-size="15">保留标签与值、表格关系、换行、勾选状态和不确定标记</text>
  <text x="64" y="188" font-size="15">关联页码与原件；可用时保留坐标和 OCR 置信度</text>
  <path d="M380 212 V248" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="248" width="680" height="112" rx="10" fill="#eef2ff" stroke="#4338ca"/>
  <text x="64" y="278" font-size="18" font-weight="600" fill="#4338ca">阶段 2 · 抽取：把证据映射为字段候选</text>
  <text x="64" y="308" font-size="15">按 Schema 定义语义、类型和枚举；执行约定的规范化</text>
  <text x="64" y="336" font-size="15">保留来源和版本；无法辨认不等于原文没有</text>
  <path d="M380 360 V396" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="396" width="680" height="112" rx="10" fill="#fffbeb" stroke="#b45309"/>
  <text x="64" y="426" font-size="18" font-weight="600" fill="#b45309">独立工程环节 · 合并、校验与复核</text>
  <text x="64" y="456" font-size="15">跨页冲突不静默覆盖；结构合法不代表字段符合原件</text>
  <text x="64" y="484" font-size="15">规则失败、证据不足或候选冲突 → 人工复核</text>
  <rect x="40" y="532" width="680" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="380" y="560" text-anchor="middle" font-size="14" fill="#475569">缓存绑定输入与配置版本；复用模型输出，按当前标准答案重算评分</text>
</svg>
